apply plugin: 'com.android.application'

android {
    signingConfigs {
        config {
        }
    }
    compileSdkVersion 27
    buildToolsVersion '27.0.0'
    defaultConfig {
        applicationId "caixa.gov.br.loterias"
        minSdkVersion 16
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        testOptions {
            execution 'ANDROID_TEST_ORCHESTRATOR'
        }
        /*
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": android.defaultConfig.applicationId]
            }
        }
        */
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        caixaprod {
            initWith debug
            //applicationIdSuffix ".caixadev"
            buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
            buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"https://simlo.des.caixa/silce-servico-rest/rest/v1/\""
        }
        caixahmg {
            initWith debug
            //applicationIdSuffix ".caixadev"
            buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
            buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"https://simlo.des.caixa/silce-servico-rest/rest/v1/\""
        }
        caixadev {
            initWith debug
            //applicationIdSuffix ".caixadev"
            buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
            buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"https://simlo.des.caixa/silce-servico-rest/rest/v1/\""
        }
        proxycap {
            initWith debug
            //applicationIdSuffix ".proxycap"
            buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
            buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"http://10.130.9.22:81/silce-servico-rest/rest/v1/\""
        }
        stubnet {
            initWith debug
            //applicationIdSuffix ".stubnet"
            buildConfigField "boolean", "CAIXA_NETWORK_STUB", "true"
            buildConfigField "String", "CAIXA_BASE_URL_SILCE", "null"
        }
    }
}

dependencies {
    // versions
    def AAVersion = '4.3.1'
    def supportVersion = '27.0.0'
    def parcelerVersion = '1.1.6'

    // annotationProcessor
    annotationProcessor "org.androidannotations:androidannotations:$AAVersion"
    annotationProcessor "org.parceler:parceler:$parcelerVersion"

    // implementation deps
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.androidannotations:androidannotations-api:$AAVersion"
    implementation "org.parceler:parceler-api:$parcelerVersion"
    implementation "com.android.support.constraint:constraint-layout:1.0.2"
    implementation "com.android.support:design:$supportVersion"
    implementation "com.android.support:cardview-v7:$supportVersion"
    implementation "me.relex:circleindicator:1.2.2@aar"
    implementation "com.google.code.gson:gson:2.8.0"
    implementation "org.jboss.aerogear:aerogear-android-authz:3.0.1"
//    implementation 'com.github.ceryle:SegmentedButton:v2.0.2'
    implementation 'commons-codec:commons-codec:1.10'
    implementation 'com.google.code.findbugs:jsr305:2.0.1'
    implementation 'com.android.volley:volley:1.0.0'
    implementation 'io.swagger:swagger-annotations:1.5.16'
    implementation 'com.yarolegovich:discrete-scrollview:1.3.1'
    implementation 'com.github.bumptech.glide:glide:3.7.0'

    // testImplementation deps
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:1.10.19'
    testImplementation 'com.google.code.findbugs:jsr305:2.0.1'

    // androidTestImplementation deps
    androidTestImplementation('com.android.support.test.espresso:espresso-core:2.2.2', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestUtil 'com.android.support.test:orchestrator:1.0.1'
}
