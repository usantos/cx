apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'

def homeV2Enabled = providers.gradleProperty('homeV2').orElse('true').get()
if (!(homeV2Enabled in ['true', 'false'])) throw new GradleException('homeV2 deve ser true ou false.')

def networkLoggingEnabled = providers.gradleProperty('networkLogging').orElse('false').get().toBoolean()
def mockBackendEnabled = providers.gradleProperty('mockBackend').orElse('false').get().toBoolean()
def mockBackendScenario = providers.gradleProperty('mockScenario').orElse('HAPPY_PATH').get().toUpperCase()
def desVersionCode = providers.gradleProperty('DES_VERSION_CODE').orElse('230102400').get().toInteger()
def desVersionName = providers.gradleProperty('DES_VERSION_NAME').orElse('1.24.0').get()
def prdVersionCode = providers.gradleProperty('PRD_VERSION_CODE').orElse('230102400').get().toInteger()
def prdVersionName = providers.gradleProperty('PRD_VERSION_NAME').orElse('1.24.0').get()
def keySetTrustedSigners = providers.gradleProperty('keySetTrustedSigners').orElse('').get()
def keySetSignatureThreshold = providers.gradleProperty('keySetSignatureThreshold').orElse('2').get().toInteger()
if (keySetSignatureThreshold < 1) {
    throw new GradleException('keySetSignatureThreshold deve ser maior que zero.')
}
def configuredSigners = keySetTrustedSigners.isBlank() ? [] : keySetTrustedSigners.split(',').collect { entry ->
    entry.trim().split('=', 2)
}
if (!configuredSigners.isEmpty() &&
        (configuredSigners.any { it.size() != 2 || it[0].isBlank() || it[1].isBlank() } ||
                configuredSigners.collect { it[0] }.toSet().size() < keySetSignatureThreshold)) {
    throw new GradleException('keySetTrustedSigners inválido ou abaixo do limiar configurado.')
}
def escapedKeySetTrustedSigners = keySetTrustedSigners.replace('\\', '\\\\').replace('"', '\\"')
def releaseSigningPropertiesFile = file(System.getProperty('user.home') + '/certificado.properties')
def releaseKeyStoreFile = file(System.getProperty('user.home') + '/Caixakeystore')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def hasReleaseSigning = releaseKeyStoreFile.isFile() &&
        releaseSigningProperties['KEYSTORE_PASSWORD'] &&
        releaseSigningProperties['KEY_ALIAS'] &&
        releaseSigningProperties['KEY_PASSWORD']

// Preserve WorkManager 2.7.1 manifest values, including API-specific resource defaults.
def topazWorkManagerDefaults = [
    topazWorkInitializer: 'androidx.startup',
    topazWorkAlarmEnabled: '@bool/enable_system_alarm_service_default',
    topazWorkJobEnabled: '@bool/enable_system_job_service_default',
    topazWorkForegroundEnabled: '@bool/enable_system_foreground_service_default',
    topazWorkReceiverEnabled: 'true',
    topazWorkInactiveReceiverEnabled: 'false',
]

