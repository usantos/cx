apply plugin: 'com.android.application'
apply plugin: 'jacoco'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'
apply from: rootProject.file('gradle/harden-filabra.gradle')
apply from: rootProject.file('gradle/harden-topaz.gradle')


def homeV2Enabled = providers.gradleProperty('homeV2').orElse('false').get()
if (!(homeV2Enabled in ['true', 'false'])) throw new GradleException('homeV2 deve ser true ou false.')

def networkLoggingEnabled = providers.gradleProperty('networkLogging').orElse('true').get().toBoolean()
def mockBackendEnabled = providers.gradleProperty('mockBackend').orElse('false').get().toBoolean()
def mockBackendScenario = providers.gradleProperty('mockScenario').orElse('HAPPY_PATH').get().toUpperCase()
def desVersionCode = providers.gradleProperty('DES_VERSION_CODE').orElse('230102400').get().toInteger()
def desVersionName = providers.gradleProperty('DES_VERSION_NAME').orElse('1.24.0').get()
def prdVersionCode = providers.gradleProperty('PRD_VERSION_CODE').orElse('230102400').get().toInteger()
def prdVersionName = providers.gradleProperty('PRD_VERSION_NAME').orElse('1.24.0').get()
apply from: rootProject.file('gradle/security-build-config.gradle')

def keySetTrustedSigners = securityBuildValue('SIMLO_KEYSET_TRUSTED_SIGNERS',
    providers.gradleProperty('keySetTrustedSigners').orElse('').get())
def keySetSignatureThreshold = securityBuildValue('SIMLO_KEYSET_SIGNATURE_THRESHOLD',
    providers.gradleProperty('keySetSignatureThreshold').orElse('2').get()).toInteger()
if (keySetSignatureThreshold < 1) {
    throw new GradleException('keySetSignatureThreshold deve ser maior que zero.')
}
def configuredSigners = keySetTrustedSigners.isBlank() ? [] : keySetTrustedSigners.split(',').collect { entry ->
    entry.trim().split('=', 2)
}
if (!configuredSigners.isEmpty() &&
        (configuredSigners.any { it.size() != 2 || it[0].isBlank() || it[1].isBlank() } ||
                configuredSigners.collect { it[0] }.toSet().size() < keySetSignatureThreshold)) {
    throw new GradleException('keySetTrustedSigners inválido ou abaixo do limiar configurado.')
}
def escapedKeySetTrustedSigners = keySetTrustedSigners.replace('\\', '\\\\').replace('"', '\\"')
def releaseSigningPropertiesFile = file(System.getProperty('user.home') + '/certificado.properties')
def releaseKeyStoreFile = file(System.getProperty('user.home') + '/Caixakeystore')
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def hasReleaseSigning = releaseKeyStoreFile.isFile() &&
        releaseSigningProperties['KEYSTORE_PASSWORD'] &&
        releaseSigningProperties['KEY_ALIAS'] &&
        releaseSigningProperties['KEY_PASSWORD']

// Preserva os valores do manifesto do WorkManager 2.7.1, incluindo os recursos padrão específicos de cada API.
def topazWorkManagerDefaults = [
    topazWorkInitializer: 'androidx.startup',
    topazWorkAlarmEnabled: '@bool/enable_system_alarm_service_default',
    topazWorkJobEnabled: '@bool/enable_system_job_service_default',
    topazWorkForegroundEnabled: '@bool/enable_system_foreground_service_default',
    topazWorkReceiverEnabled: 'true',
    topazWorkInactiveReceiverEnabled: 'false',
]

android {
    namespace = 'br.gov.caixa.loterias.apostas'
    compileSdk 37

    defaultConfig {
        applicationId 'br.gov.caixa.loterias.apostas'
        buildConfigField 'boolean', 'HOME_V2', homeV2Enabled
        minSdk 29
        targetSdk 37
        versionCode prdVersionCode
        versionName prdVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SSO_CLIENT_ID', '"cli-mob-lce"'
        buildConfigField 'String', 'SSO_REDIRECT_URI', '"br.gov.caixa.caixaloterias:/oauth2Callback"'
        buildConfigField 'String', 'SSO_ACCOUNT_REFERRER_URI', '"http://df7390sr029.corp.caixa.gov.br:8280/silce-web/?redirect_fragment=%2Fhome"'
        buildConfigField 'String', 'KEYSET_TRUSTED_SIGNERS', '"' + escapedKeySetTrustedSigners + '"'
        buildConfigField 'int', 'KEYSET_SIGNATURE_THRESHOLD', keySetSignatureThreshold.toString()
        buildConfigField 'String', 'TLS_DEFAULT_PINS', securityBuildString('SIMLO_TLS_DEFAULT_PINS')
        resValue 'string', 'app_name', 'Loterias'
        resValue 'string', 'status_toolbar_title', 'Loterias'
        resValue 'color', 'launcher_background', '#0077C8'
        manifestPlaceholders = [appAuthRedirectScheme: 'br.gov.caixa.caixaloterias', topazComponentsEnabled: 'true']
        manifestPlaceholders += topazWorkManagerDefaults
    }

    flavorDimensions 'environment'
    productFlavors {
        prd {
            dimension 'environment'
            versionCode prdVersionCode
            versionName prdVersionName
            buildConfigField 'String', 'ENVIRONMENT_NAME', '"Produção"'
            buildConfigField 'String', 'API_BASE_URL', '"https://mobileloterias.caixa.gov.br/silce-servico-rest/rest/v1/"'
            buildConfigField 'String', 'SSO_AUTH_URL', '"https://login.caixa.gov.br/auth/realms/internet/protocol/openid-connect/auth"'
            buildConfigField 'String', 'SSO_TOKEN_URL', '"https://login.caixa.gov.br/auth/realms/internet/protocol/openid-connect/token"'
            buildConfigField 'String', 'SSO_LOGOUT_URL', '"https://login.caixa.gov.br/auth/realms/internet/protocol/openid-connect/logout"'
            buildConfigField 'String', 'SSO_ACCOUNT_URL', '"https://login.caixa.gov.br/auth/realms/internet/account"'
            buildConfigField 'String', 'MERCADO_PAGO_BASE_URL', '"https://api.mercadopago.com/"'
            buildConfigField 'String', 'RECARGA_PAY_BASE_URL', '"https://secure.recarga.com/"'
            buildConfigField 'String', 'FILABRA_ACCOUNT_SYSTEM_NAME', '"caixa"'
            buildConfigField 'String', 'FILABRA_QUEUE_SYSTEM_NAME', '"loteriasprd"'
            buildConfigField 'String', 'FIREBASE_APP_ID', securityBuildString('SIMLO_PRD_FIREBASE_APP_ID')
            buildConfigField 'String', 'FIREBASE_API_KEY', securityBuildString('SIMLO_PRD_FIREBASE_API_KEY')
            buildConfigField 'String', 'FIREBASE_PROJECT_ID', securityBuildString('SIMLO_PRD_FIREBASE_PROJECT_ID')
            buildConfigField 'String', 'FIREBASE_SENDER_ID', securityBuildString('SIMLO_PRD_FIREBASE_SENDER_ID')
            buildConfigField 'boolean', 'ENABLE_NETWORK_INSPECTOR', 'false'
        }
        tqs {
            isDefault = true
            dimension 'environment'
            applicationIdSuffix '.hmp'
            versionCode desVersionCode
            versionName desVersionName
            resValue 'string', 'app_name', 'Loterias_tqs'
            buildConfigField 'String', 'ENVIRONMENT_NAME', '"TQS Externo Esteira"'
            buildConfigField 'String', 'API_BASE_URL', '"https://silce.simlo.tqs.caixa.gov.br/silce-servico-rest/rest/v1/"'
            buildConfigField 'String', 'SSO_AUTH_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/auth"'
            buildConfigField 'String', 'SSO_TOKEN_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/token"'
            buildConfigField 'String', 'SSO_LOGOUT_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/logout"'
            buildConfigField 'String', 'SSO_ACCOUNT_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/account"'
            buildConfigField 'String', 'MERCADO_PAGO_BASE_URL', '"https://api.mercadopago.com/"'
            buildConfigField 'String', 'RECARGA_PAY_BASE_URL', '"https://secure-sandbox.recargapay.com/"'
            buildConfigField 'String', 'FILABRA_ACCOUNT_SYSTEM_NAME', '"caixaloteriasdev"'
            buildConfigField 'String', 'FILABRA_QUEUE_SYSTEM_NAME', '"loteriasdes"'
            buildConfigField 'String', 'FIREBASE_APP_ID', securityBuildString('SIMLO_TQS_FIREBASE_APP_ID')
            buildConfigField 'String', 'FIREBASE_API_KEY', securityBuildString('SIMLO_TQS_FIREBASE_API_KEY')
            buildConfigField 'String', 'FIREBASE_PROJECT_ID', securityBuildString('SIMLO_TQS_FIREBASE_PROJECT_ID')
            buildConfigField 'String', 'FIREBASE_SENDER_ID', securityBuildString('SIMLO_TQS_FIREBASE_SENDER_ID')
            buildConfigField 'boolean', 'ENABLE_NETWORK_INSPECTOR', 'true'
        }
        automacao {
            dimension 'environment'
            applicationIdSuffix '.hmp'
            versionCode desVersionCode
            versionName desVersionName
            resValue 'string', 'app_name', 'Loterias_automacao'
            buildConfigField 'String', 'ENVIRONMENT_NAME', '"Automação"'
            buildConfigField 'String', 'API_BASE_URL', '"https://simlo.tqs.caixa.gov.br/silce-servico-rest/rest/v1/"'
            buildConfigField 'String', 'SSO_AUTH_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/auth"'
            buildConfigField 'String', 'SSO_TOKEN_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/token"'
            buildConfigField 'String', 'SSO_LOGOUT_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/logout"'
            buildConfigField 'String', 'SSO_ACCOUNT_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/account"'
            buildConfigField 'String', 'MERCADO_PAGO_BASE_URL', '"https://api.mercadopago.com/"'
            buildConfigField 'String', 'RECARGA_PAY_BASE_URL', '"https://secure-sandbox.recargapay.com/"'
            buildConfigField 'String', 'FILABRA_ACCOUNT_SYSTEM_NAME', '"caixaloteriasdev"'
            buildConfigField 'String', 'FILABRA_QUEUE_SYSTEM_NAME', '"loteriasdes"'
            buildConfigField 'String', 'FIREBASE_APP_ID', securityBuildString('SIMLO_AUTOMACAO_FIREBASE_APP_ID')
            buildConfigField 'String', 'FIREBASE_API_KEY', securityBuildString('SIMLO_AUTOMACAO_FIREBASE_API_KEY')
            buildConfigField 'String', 'FIREBASE_PROJECT_ID', securityBuildString('SIMLO_AUTOMACAO_FIREBASE_PROJECT_ID')
            buildConfigField 'String', 'FIREBASE_SENDER_ID', securityBuildString('SIMLO_AUTOMACAO_FIREBASE_SENDER_ID')
            buildConfigField 'boolean', 'ENABLE_NETWORK_INSPECTOR', 'false'
        }
    }

    signingConfigs {
        release {
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            if (hasReleaseSigning) {
                storeFile releaseKeyStoreFile
                storePassword releaseSigningProperties['KEYSTORE_PASSWORD']
                keyAlias releaseSigningProperties['KEY_ALIAS']
                keyPassword releaseSigningProperties['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            isDefault = true
            manifestPlaceholders.topazComponentsEnabled = (!mockBackendEnabled).toString()
            manifestPlaceholders += topazWorkManagerDefaults.collectEntries { key, value ->
                [key, mockBackendEnabled ? (key == 'topazWorkInitializer' ? 'mock-disabled' : 'false') : value]
            }
            buildConfigField 'boolean', 'ENABLE_NETWORK_LOGGING', networkLoggingEnabled.toString()
            buildConfigField 'boolean', 'ENABLE_MOCK_BACKEND', mockBackendEnabled.toString()
            buildConfigField 'String', 'MOCK_BACKEND_SCENARIO', '"' + mockBackendScenario + '"'
        }
        release {
            manifestPlaceholders.topazComponentsEnabled = 'true'
            manifestPlaceholders += topazWorkManagerDefaults
            buildConfigField 'boolean', 'ENABLE_NETWORK_LOGGING', 'false'
            buildConfigField 'boolean', 'ENABLE_MOCK_BACKEND', 'false'
            buildConfigField 'String', 'MOCK_BACKEND_SCENARIO', '"HAPPY_PATH"'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
        resValues = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

