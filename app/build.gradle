            buildConfigField 'String', 'API_BASE_URL', '"https://simlo.tqs.caixa.gov.br/silce-servico-rest/rest/v1/"'
            buildConfigField 'String', 'SSO_AUTH_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/auth"'
            buildConfigField 'String', 'SSO_TOKEN_URL', '"https://logindes.caixa.gov.br/auth/realms/internet/protocol/openid-connect/token"'
