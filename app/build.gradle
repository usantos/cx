            buildConfigField 'String', 'FIREBASE_API_KEY', '"AIzaSyBBPJ1uYLiNoyMIrwjyBbcqsokvZ48gr78"'
            buildConfigField 'String', 'FIREBASE_PROJECT_ID', '"app-loterias-simlo-nprd"'
            buildConfigField 'String', 'FIREBASE_SENDER_ID', '"75059847302"'
            buildConfigField 'boolean', 'ENABLE_NETWORK_INSPECTOR', 'false'
        }
    }

    signingConfigs {
        release {
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            if (hasReleaseSigning) {
                storeFile releaseKeyStoreFile
                storePassword releaseSigningProperties['KEYSTORE_PASSWORD']
                keyAlias releaseSigningProperties['KEY_ALIAS']
                keyPassword releaseSigningProperties['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders.topazComponentsEnabled = (!mockBackendEnabled).toString()
            manifestPlaceholders += topazWorkManagerDefaults.collectEntries { key, value ->
                [key, mockBackendEnabled ? (key == 'topazWorkInitializer' ? 'mock-disabled' : 'false') : value]
            }
            buildConfigField 'boolean', 'ENABLE_NETWORK_LOGGING', networkLoggingEnabled.toString()
            buildConfigField 'boolean', 'ENABLE_MOCK_BACKEND', mockBackendEnabled.toString()
            buildConfigField 'String', 'MOCK_BACKEND_SCENARIO', '"' + mockBackendScenario + '"'
        }
        release {
            manifestPlaceholders.topazComponentsEnabled = 'true'
            manifestPlaceholders += topazWorkManagerDefaults
            buildConfigField 'boolean', 'ENABLE_NETWORK_LOGGING', 'false'
            buildConfigField 'boolean', 'ENABLE_MOCK_BACKEND', 'false'
            buildConfigField 'String', 'MOCK_BACKEND_SCENARIO', '"HAPPY_PATH"'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
        resValues = true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

