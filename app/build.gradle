def PRD_VERSION_CODE = project.PRD_VERSION_CODE
def PRD_VERSION_NAME = project.PRD_VERSION_NAME

android {
    compileSdkVersion 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        resValue "string", "app_name", "Loterias"
        applicationId "br.gov.caixa.loterias.apostas"
        minSdkVersion 23
        targetSdkVersion 36

        //                   24                 1.24.0 = 01 024               00
        //version code = minSdkVersion + versionName(sem pontuação) + versão interna
        versionCode = PRD_VERSION_CODE.toInteger()
        versionName = PRD_VERSION_NAME
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        // Apostas confirmadas por modalidade para considerar a frequência na ordenação.
        buildConfigField "int", "MODALIDADE_REORDER_MIN_USAGE", "10"
        // Quantidade máxima de modalidades favoritas.
        buildConfigField "int", "MODALIDADE_MAX_FAVORITES", "5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        testOptions {
            execution 'ANDROID_TEST_ORCHESTRATOR'
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        kotlinOptions {
            jvmTarget = "17"
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": "br.gov.caixa.loterias.apostas"]
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            debuggable = true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

