apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.sonarqube'
apply plugin: 'com.google.firebase.crashlytics'


android {
        File certifFile = file(System.getProperty('user.home') + '/certificado.properties')
        String strKeyStorePassword = ''
        String strKeyAlias = ''
        String strKeyPassword = ''
        if (certifFile.exists()) {
            Properties p = new Properties()
            p.load(new FileInputStream(certifFile))
            strKeyStorePassword = p['KEYSTORE_PASSWORD']
            strKeyAlias = p['KEY_ALIAS']
            strKeyPassword = p['KEY_PASSWORD']

            signingConfigs {

            debug {
                storeFile file(System.getProperty('user.home') + '/Caixakeystore')
                storePassword strKeyStorePassword
                keyPassword strKeyPassword
                keyAlias strKeyAlias
            }
            config {
                storeFile file(System.getProperty('user.home') + '/Caixakeystore')
                storePassword strKeyStorePassword
                keyPassword strKeyPassword
                keyAlias strKeyAlias
            }
            release {
                enableV1Signing false
                enableV2Signing true
                storeFile file(System.getProperty('user.home') + '/Caixakeystore')
                storePassword strKeyStorePassword
                keyPassword strKeyPassword
                keyAlias strKeyAlias
            }

            }
        } else {

            signingConfigs {
                release {
                    enableV1Signing false
                    enableV2Signing true
                }
            }

            println "O arquivo certificado.properties não existe."
        }

    compileSdkVersion 37
    buildToolsVersion '36.0.0'
    defaultConfig {
        resValue "string", "app_name", "Loterias"
        applicationId "br.gov.caixa.loterias.apostas"
        minSdkVersion 23
        targetSdkVersion 36

        //                   23                 1.23.7 = 01 027               00
        //version code = minSdkVersion + versionName(sem pontuação) + versão interna
        versionCode 230123701
        versionName "1.23.7"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        testOptions {
            execution 'ANDROID_TEST_ORCHESTRATOR'
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": "br.gov.caixa.loterias.apostas"]
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
            minifyEnabled false
//            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

