kapt {
    generateStubs = true
}

dependencies {

    // versions
    def AAVersion = '4.3.1'
    def supportVersion = '27.0.0'
    def parcelerVersion = '1.1.6'

    // implementation deps
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation "com.android.support:design:$supportVersion"
    implementation "com.android.support:cardview-v7:$supportVersion"
    implementation "com.android.support:support-v4:$supportVersion"

    //Multidex (necessário quando há mais de 64k métodos)
    implementation 'com.android.support:support-v4:27.0.0'
    compile 'com.android.support:multidex:1.0.3'

    //Serialização em Parcelable
    implementation "org.parceler:parceler-api:$parcelerVersion"
    annotationProcessor "org.parceler:parceler:$parcelerVersion"

    //Android Annotations
    implementation "org.androidannotations:androidannotations-api:$AAVersion"
    annotationProcessor "org.androidannotations:androidannotations:$AAVersion"

    //Progressbar
    implementation 'me.relex:circleindicator:1.2.2@aar'

    //EditText
    compile 'ru.egslava:MaskedEditText:1.0.5'
    compile 'com.github.pinball83:masked-edittext:1.0.3'
    compile 'com.github.BlacKCaT27:CurrencyEditText:2.0.2'

    //DiscreteScrollView - RecyclerView com animação
    implementation 'com.yarolegovich:discrete-scrollview:1.3.1'

    //Biblioteca para arrastar os itens do Recyclerview
    compile "com.daimajia.swipelayout:library:1.2.0@aar"

    //Biblioteca para exibição de Dialog
    compile 'com.code-troopers.betterpickers:library:3.1.0'

    //Serialização de JSON
    implementation 'com.google.code.gson:gson:2.8.0'

    //Find Bugs in Java Programs
    implementation 'com.google.code.findbugs:jsr305:2.0.1'

    //Requisições com a API
    implementation 'com.android.volley:volley:1.0.0'
    implementation 'io.swagger:swagger-annotations:1.5.16'

    //Android application with RESTful services secured with OAuth 2 using Pipe
    implementation 'org.jboss.aerogear:aerogear-android-authz:4.0.0'
    implementation 'commons-codec:commons-codec:1.10'

    //Biblioteca de gerenciamento de imagens
    implementation 'com.github.bumptech.glide:glide:3.7.0'

    //Biblioteca de scanner de código de barras
    compile 'com.journeyapps:zxing-android-embedded:3.5.0'
    compile 'commons-lang:commons-lang:2.6'
    //compile 'me.dm7.barcodescanner:zxing:1.9'

    //QRCode gerador
    compile 'androidmads.library.qrgenearator:QRGenearator:1.0.3'

    //Mercado Pago
    compile 'com.mercadopago:sdk:3.8.1'

    //Apache commons
    compile 'org.apache.commons:commons-collections4:4.1'

    // testImplementation deps
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:1.10.19'
    testImplementation 'com.google.code.findbugs:jsr305:2.0.1'

    // androidTestImplementation deps
    androidTestImplementation('com.android.support.test.espresso:espresso-core:3.0.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestUtil 'com.android.support.test:orchestrator:1.0.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jre7:$kotlin_version"
}

