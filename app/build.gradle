apply plugin: 'com.android.application'

android {
    signingConfigs {
        config {
        }
    }
    compileSdkVersion 27
    buildToolsVersion '27.0.3'
    defaultConfig {
        applicationId "br.gov.caixa.loterias.apostar.interno"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 21101003
        versionName "1.0.0"
        multiDexEnabled true
