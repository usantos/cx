        implementation fileTree('libs/QRGenearator-1.0.3.aar')

        implementation 'com.mercadolibre.android.device:sdk:3.0.5'

        //Apache commons
        implementation 'org.apache.commons:commons-collections4:4.1'


        //Segmented Control
        implementation 'info.hoang8f:android-segmented:1.0.6'

        //Flexbox
        //implementation 'com.google.android:flexbox:1.0.0'
        //implementation 'com.google.android:flexbox:3.0.0'
        implementation fileTree('libs/flexbox-3.0.0.aar')

        //AppCenter
        implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
        implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"

        //FilaBRA
        implementation 'com.filabra.adapter:FilaBRAAdapter:2.6.5.1'

        //Joda time
        implementation 'net.danlew:android.joda:2.10.9.1'

        // testImplementation deps
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:1.10.19'
        testImplementation 'com.google.code.findbugs:jsr305:3.0.2'

        // androidTestImplementation deps
        androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
            exclude group: 'com.android.support', module: 'support-annotations'
        })

        // root check
        implementation 'com.scottyab:rootbeer-lib:0.1.1'

        //Topaz OFD
        implementation 'br.com.topaz:heartbeat:4.+'

        //Biometria
        implementation 'androidx.biometric:biometric:1.1.0'

        //Work Manager dependency
        implementation 'androidx.work:work-runtime:2.9.1'

        androidTestImplementation 'androidx.test:runner:1.6.1'
        androidTestUtil 'androidx.test:orchestrator:1.5.0'

        //Firebase
        implementation platform("com.google.firebase:firebase-bom:34.12.0")
        implementation "com.google.firebase:firebase-analytics"
        implementation "com.google.firebase:firebase-crashlytics"
        implementation "com.google.firebase:firebase-messaging"
        implementation "com.google.firebase:firebase-config"
        implementation "com.google.firebase:firebase-perf"
        implementation "com.google.firebase:firebase-appcheck"
        implementation "com.google.firebase:firebase-installations"
        implementation "com.google.firebase:firebase-sessions"

    }

    sonarqube {
        properties {
            def libraries = project.android.sdkDirectory.getPath() + "/platforms/android-28/android.jar"
/* + ", build/intermediates/exploded-aar*//**//*classes.jar"*/
            property "sonar.sources", "src/main/java"
            property "sonar.binaries", "build/intermediates/classes/debug"
            property "sonar.libraries", libraries
            property "sonar.tests", "src/test/java, src/androidTest/java"
//        property "sonar.java.test.binaries", "build/intermediates/class/debug"
            property "sonar.java.test.libraries", libraries
            property "sonar.jacoco.reportPath", "build/jacoco/testDebugUnitTest.exec"
            property "sonar.java.coveragePlugin", "jacoco"
            property "sonar.junit.reportsPath", "build/test-results/debug"
            property "sonar.android.lint.report", "build/outputs/lint-results"
        }
    }
