apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.sonarqube'


android {
        File certifFile = file(System.getProperty('user.home') + '/certificado.properties')
        String strKeyStorePassword = ''
        String strKeyAlias = ''
        String strKeyPassword = ''
        if (certifFile.exists()) {
            Properties p = new Properties()
            p.load(new FileInputStream(certifFile))
            strKeyStorePassword = p['KEYSTORE_PASSWORD']
            strKeyAlias = p['KEY_ALIAS']
            strKeyPassword = p['KEY_PASSWORD']

            signingConfigs {

            debug {
                storeFile file(System.getProperty('user.home') + '/Caixakeystore')
                storePassword strKeyStorePassword
                keyPassword strKeyPassword
                keyAlias strKeyAlias
            }
            config {
                storeFile file(System.getProperty('user.home') + '/Caixakeystore')
                storePassword strKeyStorePassword
                keyPassword strKeyPassword
                keyAlias strKeyAlias
            }
            release {
                storeFile file(System.getProperty('user.home') + '/Caixakeystore')
                storePassword strKeyStorePassword
                keyPassword strKeyPassword
                keyAlias strKeyAlias
            }

            }
        } else {
            println "O arquivo certificado.properties não existe."
        }

    compileSdkVersion 33
    buildToolsVersion '29.0.2'
    defaultConfig {
        resValue "string", "app_name", "Loterias"
        applicationId "br.gov.caixa.loterias.apostas"
        minSdkVersion 22
        targetSdkVersion 33

        // SPRINT 86
        //                   22                 1.9.0 = 01 009               00
        //version code = minSdkVersion + versionName(sem pontuação) + versão interna
        versionCode 220100900
        versionName "1.9.0"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        testOptions {
            execution 'ANDROID_TEST_ORCHESTRATOR'
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": "br.gov.caixa.loterias.apostas"]
                arguments = ["androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()]
            }
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
            minifyEnabled false
//            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

