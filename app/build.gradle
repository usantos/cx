jacoco {
    toolVersion = '0.8.12'
}

tasks.register('jacocoTestPrdReleaseUnitTestReport', JacocoReport) {
    dependsOn 'testPrdReleaseUnitTest'

    def prdReleaseClasses = layout.buildDirectory.dir('intermediates/javac/prdRelease/compilePrdReleaseJavaWithJavac/classes').get().asFile
    def prdReleaseExecutionData = layout.buildDirectory.file('jacoco/testPrdReleaseUnitTest.exec').get().asFile

    def exclusions = ['**/R.class',
                      '**/R$*.class',
                      '**/BuildConfig.*',
                      '**/Manifest*.*']

    sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin'))
    classDirectories.setFrom(files(fileTree(dir: prdReleaseClasses,
            excludes: exclusions),
            fileTree(dir: "$buildDir/tmp/kotlin-classes/prdRelease",
                    excludes: exclusions)))

    executionData.setFrom(files(prdReleaseExecutionData))

    reports {
        xml.required = true
        csv.required = false
        html.required = false
    }
}

