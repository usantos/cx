apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    signingConfigs {
        config {
        }
    }
    compileSdkVersion 27
    buildToolsVersion '27.0.0'
    defaultConfig {
        applicationId "caixa.gov.br.loterias"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        testOptions {
            execution 'ANDROID_TEST_ORCHESTRATOR'
        }
        /*
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["resourcePackageName": android.defaultConfig.applicationId]
            }
        }
        */
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        flavorDimensions 'default'
        productFlavors {
            caixaprod {
                dimension "default"
                //applicationIdSuffix ".caixaprod"
                buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
                buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"https://www.loteriasonline.caixa.gov.br/silce-servico-rest/rest/v1/\""
                buildConfigField "String", "PUBLIC_KEY_MP", "\"TEST-946a3077-5cf1-446c-bab3-e3a266357e9f\""
                buildConfigField "String", "CAIXA_BASE_URL_SSO", "\"https://login.caixa.gov.br\""
                buildConfigField "String", "MP_PAYMENT_URL", "\"https://api.mercadopago.com/v1/payment_methods/installments?\""
            }
            caixahmg {
                dimension "default"
                //applicationIdSuffix ".caixahmg"
                buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
                buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"http://simlo.des.caixa/silce-servico-rest/rest/v1/\""
                buildConfigField "String", "PUBLIC_KEY_MP", "\"TEST-946a3077-5cf1-446c-bab3-e3a266357e9f\""
                buildConfigField "String", "CAIXA_BASE_URL_SSO", "\"https://logindes.caixa.gov.br\""
                buildConfigField "String", "MP_PAYMENT_URL", "\"https://api.mercadopago.com/v1/payment_methods/installments?\""
            }
            caixadev {
                dimension "default"
                //applicationIdSuffix ".caixadev"
                buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
//                    buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"http://simlo.des.caixa/silce-servico-rest/rest/v1/\""
                buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"http://df7390sr029.corp.caixa.gov.br:8280/silce-servico-rest/rest/v1/\""
                buildConfigField "String", "PUBLIC_KEY_MP", "\"TEST-946a3077-5cf1-446c-bab3-e3a266357e9f\""
                buildConfigField "String", "CAIXA_BASE_URL_SSO", "\"https://logindes.caixa.gov.br\""
                buildConfigField "String", "MP_PAYMENT_URL", "\"https://api.mercadopago.com/v1/payment_methods/installments?\""
            }
            caixalab {
                dimension "default"
                //applicationIdSuffix ".caixalab"
                buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
                buildConfigField "String", "CAIXA_BASE_URL_SILCE", "\"http://172.16.141.157:80/silce-servico-rest/rest/v1/\""
                buildConfigField "String", "PUBLIC_KEY_MP", "\"TEST-946a3077-5cf1-446c-bab3-e3a266357e9f\""
                buildConfigField "String", "CAIXA_BASE_URL_SSO", "\"https://logindes.caixa.gov.br\""
                buildConfigField "String", "MP_PAYMENT_URL", "\"https://api.mercadopago.com/v1/payment_methods/installments?\""
            }
            proxycap {
                dimension "default"
                //applicationIdSuffix ".proxycap"
                buildConfigField "boolean", "CAIXA_NETWORK_STUB", "false"
