// O Studio carrega o XML compartilhado; o gate apenas valida, sem editar o workspace pessoal.
def expectedOptions = [
        MODE: 'specific_activity',
        ACTIVITY_CLASS: 'br.gov.caixa.loterias.apostas.MainActivity',
        CLEAR_APP_STORAGE: 'false',
        SKIP_ACTIVITY_VALIDATION: 'false',
        ALWAYS_INSTALL_WITH_PM: 'true',
        ALLOW_ASSUME_VERIFIED: 'false',
]
def problems = { String xml, String projectName ->
    def errors = []
    if (projectName != 'simlo-app-android') errors += 'Nome raiz Gradle deve ser estável em qualquer pasta/OS'
    def root
    try {
        root = new groovy.xml.XmlSlurper(false, false).parseText(xml)
    } catch (org.xml.sax.SAXException failure) {
        return errors + ['XML da configuração do Studio inválido']
    }
    if (root.name() != 'component' || root.@name.text() != 'ProjectRunConfigurationManager' || root.configuration.size() != 1) {
        return errors + ['Arquivo deve conter uma única configuração compartilhada do IDE']
    }
    def config = root.configuration[0]
    if (config.@name.text() != 'SIMLO App' || config.@type.text() != 'AndroidRunConfigurationType' ||
            config.@factoryName.text() != 'Android App' || config.@default.text() != 'false') {
        errors += 'SIMLO App deve ser uma configuração Android compartilhada'
    }
    if (config.module.size() != 1 || config.module.@name.text() != 'simlo-app-android.app') {
        errors += 'Configuração deve apontar para o módulo app estável'
    }
    expectedOptions.each { name, value ->
        def options = config.option.findAll { it.@name.text() == name }
        if (options.size() != 1 || options[0].@value.text() != value) errors += "SIMLO App: ${name} deve ser ${value}"
    }
    def beforeRun = config.method.option
    if (config.method.size() != 1 || beforeRun.size() != 1 ||
            beforeRun[0].@name.text() != 'Android.Gradle.BeforeRunTask' || beforeRun[0].@enabled.text() != 'true') {
        errors += 'Antes do Play deve existir somente a compilação Gradle nativa, sem scripts externos'
    }
    errors
}
// O menu de módulo pode oferecer "All Tests" instrumentado e "Tests in ..." JVM.
// A política compartilhada mantém os produtores Gradle e remove a escolha automática do dispositivo.
def localTestProblems = { String runXml, String producersXml ->
    def errors = []
    def parser = new groovy.xml.XmlSlurper(false, false)
    def config = parser.parseText(runXml).configuration
    def tasks = config.ExternalSystemSettings.option.find { it.@name.text() == 'taskNames' }.list.option.collect { it.@value.text() }
    if (config.size() != 1 || config.@type.text() != 'GradleRunConfiguration' || tasks != ['runAllTests']) {
        errors += 'Suíte compartilhada deve executar todos os ambientes via Gradle/JVM'
    }
    def producers = parser.parseText(producersXml).component.find { it.@name.text() == 'RunConfigurationProducerService' }
            .option.find { it.@name.text() == 'ignoredProducers' }.set.option.collect { it.@value.text() }
    if (!producers.contains('com.android.tools.idea.testartifacts.instrumented.AndroidTestConfigurationProducer')) {
        errors += 'All Tests não deve gerar automaticamente configuração instrumentada'
    }
    if (producers.any { it.startsWith('org.jetbrains.plugins.gradle.') || it.startsWith('org.jetbrains.kotlin.idea.gradleJava.') }) {
        errors += 'Produtores de testes JVM/Gradle devem continuar habilitados'
    }
    errors
}
tasks.register('verifyAndroidStudioRunConfiguration') {
    group = 'verification'
    description = 'Validates native shared Android Studio configuration and isolated regression fixtures.'
    doLast {
        def source = file('.run/SIMLO_App.run.xml')
        if (!source.isFile()) throw new GradleException('Configuração compartilhada SIMLO App ausente')
        def xml = source.getText('UTF-8')
        def actual = problems(xml, rootProject.name)
        if (actual) throw new GradleException(actual.join('; '))
        def invalid = [
                xml.replace('value="specific_activity"', 'value="default_activity"'),
                xml.replace('value="br.gov.caixa.loterias.apostas.MainActivity"', 'value="br.gov.caixa.loterias.apostas.launcher.DefaultLauncher"'),
                xml.replace('name="simlo-app-android.app"', 'name="cx.app"'),
                xml.replace('name="SIMLO App"', 'name="app"'),
                xml.replace('type="AndroidRunConfigurationType"', 'type="Application"'),
                xml.replace('name="CLEAR_APP_STORAGE" value="false"', 'name="CLEAR_APP_STORAGE" value="true"'),
                xml.replace('name="SKIP_ACTIVITY_VALIDATION" value="false"', 'name="SKIP_ACTIVITY_VALIDATION" value="true"'),
                xml.replace('name="ALLOW_ASSUME_VERIFIED" value="false"', 'name="ALLOW_ASSUME_VERIFIED" value="true"'),
                xml.replace('</method>', '<option name="ExternalTool" enabled="true" /></method>'),
                xml.replace('</configuration>', '<option name="MODE" value="specific_activity" /></configuration>'),
        ]
        invalid.eachWithIndex { fixture, index ->
            if (fixture == xml || problems(fixture, rootProject.name).isEmpty()) {
                throw new GradleException("Fixture inválida do Studio aceita: ${index}")
            }
        }
        if (problems(xml, 'cx').isEmpty()) throw new GradleException('Nome de módulo dependente da pasta aceito')
        def runXml = file('.run/SIMLO_Testes_JVM.run.xml').getText('UTF-8')
        def producersXml = file('.idea/runConfigurations.xml').getText('UTF-8')
        def testErrors = localTestProblems(runXml, producersXml)
        if (testErrors) throw new GradleException(testErrors.join('; '))
        def globalReport = tasks.named('allEnvironmentTestReport').get()
        def routesToGlobalReport = { Collection dependencies -> dependencies.toSet() == ([globalReport] as Set) }
        def incomplete = allprojects.findAll { owner ->
            def alias = owner.tasks.findByName('runAllTests')
            alias == null || !routesToGlobalReport(alias.taskDependencies.getDependencies(alias))
        }
        if (incomplete) throw new GradleException("Run All Tests deve executar o projeto completo em cada módulo: ${incomplete*.path}")
        def partialSuite = tasks.named('allUnitTests').get()
        [[], [partialSuite], [globalReport, partialSuite]].each { fixture ->
            if (routesToGlobalReport(fixture)) throw new GradleException('Encaminhamento vazio, parcial ou duplicado aceito')
        }
        [runXml.replace('GradleRunConfiguration', 'AndroidTestRunConfigurationType'),
         runXml.replace('runAllTests', ':app:connectedPrdDebugAndroidTest')].each { fixture ->
            if (fixture == runXml || localTestProblems(fixture, producersXml).isEmpty()) {
                throw new GradleException('Suíte compartilhada instrumentada aceita')
            }
        }
        def instrumented = 'com.android.tools.idea.testartifacts.instrumented.AndroidTestConfigurationProducer'
        if (localTestProblems(runXml, producersXml.replace(instrumented, 'unused.Producer')).isEmpty()) {
            throw new GradleException('Seleção automática instrumentada aceita')
        }
        def disabledGradle = producersXml.replace('</set>', '<option value="org.jetbrains.plugins.gradle.execution.test.runner.AllInDirectoryGradleConfigurationProducer" /></set>')
        if (localTestProblems(runXml, disabledGradle).isEmpty()) throw new GradleException('Executor Gradle desabilitado aceito')
        logger.lifecycle('Studio nativo: SIMLO App abre MainActivity; 12 fixtures aprovadas; nenhum script ou workspace modificado.')
        logger.lifecycle('Run Tests: Gradle/JVM em todos os módulos; seleção automática instrumentada desabilitada; 4 regressões rejeitadas.')
        logger.lifecycle("Run All Tests: ${allprojects.size()} entradas encaminham para a mesma suíte global dos três ambientes; 3 regressões de encaminhamento rejeitadas.")
    }
}
