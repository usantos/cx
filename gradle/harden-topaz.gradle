// Preserva o SDK homologado imutável e todas as suas dependências. Reforça apenas
// sua fonte de entropia de chave AES, em debug e release, antes do consumo pelo AGP/R8.
def topazInput = rootProject.file('third-party/maven/br/com/topaz/heartbeat/4.38.0.1658708/heartbeat-4.38.0.1658708.aar')
def topazPom = new File(topazInput.parentFile, 'heartbeat-4.38.0.1658708.pom')
def topazOutput = rootProject.layout.buildDirectory.file('intermediates/hardened-topaz/heartbeat-secure-random.aar')
def topazClasses = rootProject.layout.buildDirectory.file('intermediates/hardened-topaz/heartbeat-secure-random.jar')
def preparedTopaz = rootProject.vendorArtifactsFor(project, 'topaz')
if (!rootProject.tasks.findByName('hardenTopazHeartbeat')) {
    def rootTopaz = rootProject.vendorArtifactsFor(rootProject, 'topaz')
    def hardenTopaz = rootProject.tasks.register('hardenTopazHeartbeat') {
        inputs.files rootTopaz.aar, rootTopaz.classes
        outputs.file topazOutput
        outputs.file topazClasses
        doLast {
            def output = topazOutput.get().asFile
            output.parentFile.mkdirs()
            output.bytes = rootTopaz.aar.singleFile.bytes
            topazClasses.get().asFile.bytes = rootTopaz.classes.singleFile.bytes
        }
    }
    def verifyTopazRandom = rootProject.tasks.register('verifyTopazKeyRandom', Exec) {
        group = 'verification'
        dependsOn hardenTopaz
        inputs.files rootProject.file('scripts/test-topaz-random.py'), rootProject.file('scripts/harden-topaz-random.py')
        environment 'JAVA_HOME', System.getProperty('java.home')
        commandLine 'python3', rootProject.file('scripts/test-topaz-random.py').absolutePath,
                '--original', topazInput.absolutePath, '--aar', topazOutput.get().asFile.absolutePath
    }
    rootProject.tasks.matching { it.name == 'verifyTopazHeartbeat' }.configureEach { dependsOn verifyTopazRandom }
}
ext.hardenedTopazHeartbeat = preparedTopaz.aar
ext.hardenedTopazHeartbeatClasses = preparedTopaz.classes

// Um AAR local não possui metadados transitivos. Preserva cada dependência original de compilação/execução
// do POM adjacente com versão fixada para evitar manter uma segunda lista.
def metadata = new groovy.xml.XmlSlurper(false, false).parse(topazPom)
if (metadata.groupId.text() != 'br.com.topaz' || metadata.artifactId.text() != 'heartbeat' ||
        metadata.version.text() != libs.topaz.heartbeat.get().versionConstraint.requiredVersion) {
    throw new GradleException('Topaz coordinates changed: review the hardened input and dependencies.')
}
metadata.dependencies.dependency.each { dependency ->
    if (!(dependency.scope.text() in ['compile', 'runtime']) ||
            dependency.classifier.text() || dependency.type.text() || dependency.exclusions.size()) {
        throw new GradleException('Unsupported Topaz POM dependency: review hardening metadata.')
    }
    dependencies.add('implementation', "${dependency.groupId.text()}:${dependency.artifactId.text()}:${dependency.version.text()}")
}

tasks.named('check').configure { dependsOn rootProject.tasks.named('verifyTopazKeyRandom') }
