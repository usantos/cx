// Os modelos de domínio também são exercitados pelos testes reais de contrato de migração DTO/SQLite.
// Mescla seus dados de execução com estas mesmas classes de domínio para evitar duplicar testes.
def featureDataProjects = [
        project(':feature:account:data'),
        project(':feature:betting:data'),
        project(':feature:cart:data'),
        project(':feature:home:data'),
        project(':feature:marketplace:data'),
        project(':feature:notifications:data'),
        project(':feature:onboarding:data'),
        project(':feature:payment:data'),
        project(':feature:responsible-gaming:data'),
        project(':feature:results:data'),
        project(':feature:retail:data'),
        project(':feature:support:data'),
        project(':feature:tickets:data'),
]
def domainModules = [project(':feature:marketplace:api'), project(':feature:account:domain'), project(':feature:betting:domain'), project(':feature:cart:domain'), project(':feature:home:domain'), project(':feature:marketplace:domain'), project(':feature:notifications:domain'), project(':feature:onboarding:domain'), project(':feature:payment:domain'), project(':feature:responsible-gaming:domain'), project(':feature:results:domain'), project(':feature:retail:domain'), project(':feature:support:domain'), project(':feature:tickets:domain'), project(':feature:cart:api')]
def domainCoverageExecution = files(
        featureDataProjects.collect { owner ->
            files({
                owner.tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
            }, fileTree(owner.layout.buildDirectory).include('outputs/code_coverage/**/*.ec')).filter { it.isFile() }
        },
        files({
            project(':app').tasks.named('testPrdDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
        }).filter { it.isFile() },
        fileTree(layout.buildDirectory).include('jacoco/test.exec'),
        domainModules.collect { owner -> fileTree(owner.layout.buildDirectory).include('jacoco/test.exec') },
        fileTree(project(':core:data').layout.buildDirectory).include('jacoco/test.exec')
)
def domainCoverageClasses = files({ [sourceSets.main.output] + domainModules.collect { it.sourceSets.main.output } })
def domainCoverageSources = files({ [sourceSets.main.allSource.srcDirs] + domainModules.collect { it.sourceSets.main.allSource.srcDirs } })

tasks.register('verifyDomainCoverageInputs') {
    // Estas suítes nativas reais também produzem dados de execução consumidos por este relatório.
    dependsOn ':feature:account:data:connectedDebugAndroidTest', ':feature:cart:data:connectedDebugAndroidTest', ':feature:notifications:data:connectedDebugAndroidTest'
    dependsOn tasks.named('test')
    dependsOn domainModules.collect { it.path + ':test' }
    dependsOn ':core:data:test'
    dependsOn featureDataProjects.collect { it.path + ':testDebugUnitTest' }
    dependsOn ':app:testPrdDebugUnitTest'
    doLast {
        if (domainCoverageExecution.isEmpty() || domainCoverageClasses.asFileTree.matching { include '**/*.class' }.isEmpty()) {
            throw new GradleException('Cobertura de domain sem classes ou execução de testes.')
        }
    }
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('verifyDomainCoverageInputs')
    executionData.setFrom(domainCoverageExecution)
    sourceDirectories.setFrom(domainCoverageSources)
    classDirectories.setFrom(domainCoverageClasses)
    reports { xml.required = true; html.required = true }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
    dependsOn tasks.named('jacocoTestReport')
    executionData.setFrom(domainCoverageExecution)
    sourceDirectories.setFrom(domainCoverageSources)
    classDirectories.setFrom(domainCoverageClasses)

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.9501
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
