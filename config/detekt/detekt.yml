build:
  maxIssues: 0
config:
  validation: true
  warningsAsErrors: true
complexity:
  active: true
  LongMethod:
    active: true
    threshold: 80
  LargeClass:
    active: true
    threshold: 600
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInInterfaces: 25
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '^$'
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames: ['Exception', 'RuntimeException', 'Throwable']
  TooGenericExceptionThrown:
    active: true
  SwallowedException:
    active: true
style:
  active: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNumbers: ['-1', '0', '1', '2']
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  UnusedParameter:
    active: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 3
  WildcardImport:
    active: true
    excludeImports: []
  ForbiddenComment:
    active: true
    comments: ['TODO:', 'FIXME:', 'STOPSHIP:']
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeImportStatements: true
    excludeCommentStatements: true
  NewLineAtEndOfFile:
    active: true
