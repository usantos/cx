// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '2.2.21'
    }
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath "com.google.gms:google-services:4.4.1"
        classpath "com.google.firebase:firebase-crashlytics-gradle:2.9.9"
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:2.7.1"
        classpath "com.github.triplet.gradle:play-publisher:3.8.6"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.6'

        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version"
    }
}

apply from: 'gradle/android-processors.gradle'
apply from: 'gradle/core-local-tests.gradle'

project(':core').subprojects { coreModule ->
    def javaVersion = JavaVersion.VERSION_17
    ['org.jetbrains.kotlin.android', 'org.jetbrains.kotlin.jvm'].each { pluginId ->
        coreModule.plugins.withId(pluginId) {
            coreModule.kotlin.compilerOptions.jvmTarget.set(
                org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(javaVersion.majorVersion)
            )
        }
    }
    coreModule.plugins.withId('java-library') {
        coreModule.java {
            sourceCompatibility = javaVersion
            targetCompatibility = javaVersion
        }
    }
    coreModule.plugins.withId('com.android.library') {
        coreModule.android {
            compileSdk 36
            compileOptions {
                sourceCompatibility = javaVersion
                targetCompatibility = javaVersion
            }
        }
    }
    coreModule.plugins.withId('jacoco') {
        coreModule.jacoco.toolVersion = '0.8.13'
    }
}

def remoteVendorSdks = providers.gradleProperty('remoteVendorSdks').map { value ->
    if (!(value in ['true', 'false'])) {
        throw new GradleException('remoteVendorSdks deve ser true ou false.')
    }
    value == 'true'
}.get()

ext.filaBraSdk = remoteVendorSdks
        ? 'com.filabra.adapter:FilaBRAAdapter:2.6.5.1'
        : files('third-party/FilaBRAAdapter-2.6.5.1.aar')

allprojects {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    if (remoteVendorSdks) {
                        name = 'topazRemote'
                        url = 's3://mobile-artifacts-repo/releases'
                        credentials(AwsCredentials)
                    } else {
                        name = 'topazLocal'
                        url = rootProject.uri('third-party/maven')
                    }
                }
            }
            filter { includeModule 'br.com.topaz', 'heartbeat' }
        }
        if (!project.path.startsWith(':core:')) {
            jcenter {
                content {
                    excludeGroup 'org.jetbrains.kotlin'
                    excludeGroup 'org.jetbrains.kotlinx'
                }
            }
        }
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }

        maven {
            url 'https://s3.amazonaws.com/fabric-artifacts-private/internal-snapshots'
        }
        maven {
            url 'https://maven.fabric.io/public'
        }
        maven {
            url "https://artifacts.mercadolibre.com/repository/android-releases"
        }

        maven {
            url("http://binario.caixa:8081/repository/releases/")
            setAllowInsecureProtocol(true)
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}