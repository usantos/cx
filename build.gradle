// Arquivo raiz de compilação para configurações comuns a todos os subprojetos e módulos.
buildscript {
    ext {
        kotlin_version = '2.4.10'
    }
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }
    dependencies {
        // Também processa metadados Kotlin 2.4 das dependências, mantendo AGP 8.13.
        classpath 'com.android.tools:r8:9.1.57'
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version"
        classpath 'com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.6'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.58'
    }
}


apply from: rootProject.file('gradle/jvm-toolchains.gradle')
apply from: rootProject.file('gradle/vendor-artifact-transforms.gradle')
apply from: rootProject.file('gradle/android-processors.gradle')
apply from: rootProject.file('gradle/android-lint.gradle')
apply from: rootProject.file('gradle/verify-feature-modules.gradle')
apply from: rootProject.file('gradle/persistence-coverage.gradle')
apply from: rootProject.file('gradle/local-ui-tests.gradle')
apply from: rootProject.file('gradle/aggregate-test-reports.gradle')
apply from: rootProject.file('gradle/static-analysis.gradle')
apply from: rootProject.file('gradle/quality-gate.gradle')
apply from: rootProject.file('gradle/source-tracking.gradle')
apply from: rootProject.file('gradle/verify-vendor-sync.gradle')
apply from: rootProject.file('gradle/compose-platform-resources.gradle')

allprojects {
    repositories {
        // SDK CX homologado, incluído localmente sem exigir credenciais de repositório privado.
        maven { url = uri("${rootDir}/third-party/maven"); content { includeGroup "br.com.topaz" } }
        mavenCentral()
        google()
        maven { url = uri("https://jitpack.io") }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.register('verifyComposeMigration') {
    group = 'verification'
    description = 'Ensures the modern application graph contains no legacy UI artifacts.'
    doLast {
        def roots = [file('app'), file('core'), file('feature')]
        def javaProductionSources = roots.collectMany { root ->
            fileTree(root).matching { include '**/src/main/**/*.java', '**/src/domain/**/*.java', '**/src/data/**/*.java', '**/src/platform/**/*.java', '**/src/host/**/*.java' }.files
        }
        if (!javaProductionSources.isEmpty()) {
            throw new GradleException("O aplicativo migrado deve usar Kotlin: ${javaProductionSources}")
        }
        if (file('app-compose').exists()) {
            throw new GradleException('O módulo temporário app-compose não pode ser recriado; o aplicativo deve permanecer em :app.')
        }

        def requiredManifest = file('app/src/main/AndroidManifest.xml').canonicalFile
        // O Android desenha a tela de abertura antes do Compose; este estilo é uma
        // configuração obrigatória da plataforma, sem hierarquia de View ou layout.
        def requiredPlatformTheme = file('app/src/main/res/values/themes.xml').canonicalFile
        def adaptiveIcon = file('app/src/main/res/mipmap-anydpi/ic_launcher.xml').canonicalFile
        def adaptiveRoundIcon = file('app/src/main/res/mipmap-anydpi/ic_launcher_round.xml').canonicalFile
        def debugManifest = file('app/src/debug/AndroidManifest.xml').canonicalFile
        def allowedPlatformXml = [requiredManifest, requiredPlatformTheme, adaptiveIcon, adaptiveRoundIcon, debugManifest] as Set
        allowedPlatformXml.addAll(verifyComposePlatformResources())
        // Account observa a conectividade; declara a permissão normal na biblioteca responsável.
        // Este manifesto contém apenas configuração, sem componentes ou permissões adicionais.
        def accountNetworkManifest = file('feature/account/presentation/src/main/AndroidManifest.xml').canonicalFile
        if (accountNetworkManifest.isFile()) {
            def root = new groovy.xml.XmlSlurper(false, false).parse(accountNetworkManifest)
            def networkPermissionOnly = root.name() == 'manifest' &&
                    root.attributes() == ['xmlns:android': 'http://schemas.android.com/apk/res/android'] &&
                    root.text().trim().isEmpty() && root.children().size() == 1 &&
                    root.'uses-permission'.size() == 1 &&
                    root.'uses-permission'[0].children().isEmpty() &&
                    root.'uses-permission'[0].attributes() == ['android:name': 'android.permission.ACCESS_NETWORK_STATE']
            if (!networkPermissionOnly) {
                throw new GradleException('Manifest Account deve conter somente ACCESS_NETWORK_STATE, sem componentes ou permissões adicionais.')
            }
            allowedPlatformXml.add(accountNetworkManifest)
        }
        // Configuração existente do FileProvider, sem hierarquia de interface ou acesso amplo ao cache.
        def receiptPaths = file('app/src/main/res/xml/receipt_file_paths.xml').canonicalFile
        if (receiptPaths.isFile()) {
            def root = new groovy.xml.XmlSlurper(false, false).parse(receiptPaths)
            def receiptCacheOnly = root.name() == 'paths' &&
                    root.attributes() == ['xmlns:android': 'http://schemas.android.com/apk/res/android'] &&
                    root.text().trim().isEmpty() &&
                    root.children().size() == 1 && root.'cache-path'.size() == 1 &&
                    root.'cache-path'[0].children().isEmpty() &&
                    root.'cache-path'[0].attributes() == ['name': 'comprovantes', 'path': 'receipts/']
            if (!receiptCacheOnly) {
                throw new GradleException('FileProvider de comprovantes deve conter somente cache-path comprovantes em receipts/.')
            }
            allowedPlatformXml.add(receiptPaths)
        }
        // Referências independentes dos testes de geometria: somente visibilidade do APK CX.
        // Não permite elementos application, permissões ou pacotes adicionais nesses manifestos.
        [
                'feature/betting/presentation/src/androidTest/AndroidManifest.xml',
                'feature/onboarding/presentation/src/androidTest/AndroidManifest.xml',
                'feature/cart/presentation/src/androidTest/AndroidManifest.xml',
        ].each { path ->
            def manifest = file(path).canonicalFile
            if (manifest.isFile()) {
                def root = new groovy.xml.XmlSlurper(false, false).parse(manifest)
                def queryOnly = root.name() == 'manifest' &&
                        root.attributes() == ['xmlns:android': 'http://schemas.android.com/apk/res/android'] &&
                        root.text().trim().isEmpty() &&
                        root.children().size() == 1 && root.queries.size() == 1 &&
                        root.queries[0].attributes().isEmpty() && root.queries[0].children().size() == 1 &&
                        root.queries.'package'.size() == 1 &&
                        root.queries.'package'[0].children().isEmpty() &&
                        root.queries.'package'[0].attributes() == ['android:name': 'br.gov.caixa.loterias.apostas.cxv2validation']
                if (!queryOnly) throw new GradleException("Manifest do oráculo deve conter somente a query CX: ${manifest}")
                allowedPlatformXml.add(manifest)
            }
        }
        // Os recursos gráficos preservam os vetores e LayerDrawables originais; não são telas XML.
        // A lista é explícita: novos XMLs exigem revisão e permanecem bloqueados por padrão.
        def legacyResourceInventory = file('docs/LEGACY_DRAWABLE_RESOURCES.txt')
        def allowedLegacyResourceXml = legacyResourceInventory.readLines('UTF-8')
                .findAll { it.trim() && !it.startsWith('#') }.collect { file(it).canonicalFile } as Set
        def drawingElements = ['vector', 'path', 'group', 'clip-path', 'shape', 'solid', 'stroke',
                'corners', 'padding', 'size', 'gradient', 'layer-list', 'item', 'rotate', 'inset',
                'selector', 'bitmap', 'scale', 'clip', 'level-list', 'transition', 'animated-vector', 'target'] as Set
        allowedLegacyResourceXml.each { source ->
            if (!source.isFile()) throw new GradleException("Recurso legado registrado ausente: ${source}")
            def root = new groovy.xml.XmlSlurper(false, false).parse(source)
            def isDrawing = source.parentFile.name.startsWith('drawable') &&
                    root.depthFirst().every {
                        drawingElements.contains(it.name()) ||
                                (root.name() == 'vector' && it.name() == 'aapt:attr' &&
                                        it.@name.text() in ['android:fillColor', 'android:strokeColor'])
                    }
            def nativeParityThemes = [
                    file('feature/betting/presentation/src/main/res/values/rapid_picker_styles.xml').canonicalFile,
                    file('feature/betting/presentation/src/main/res/values/betting_favorite_dialog_styles.xml').canonicalFile,
                    file('feature/betting/presentation/src/main/res/values/betting_simulation_styles.xml').canonicalFile,
            ] as Set
            def isPickerTheme = nativeParityThemes.contains(source) &&
                    root.name() == 'resources' && root.children().every { it.name() == 'style' } &&
                    root.depthFirst().every { it.name() in ['resources', 'style', 'item'] }
            // Apenas os dois rótulos de campanha existentes com várias linhas estão aprovados;
            // layouts e recursos de valores arbitrários continuam proibidos, inclusive neste arquivo.
            def campaignLabels = file('feature/home/presentation/src/main/res/values/home_special_contests.xml').canonicalFile
            def expectedCampaignLabels = ['home_mega_sena_30_anos_duas_linhas', 'home_loteca_pais_duas_linhas'] as Set
            def isCampaignLabels = source == campaignLabels && root.name() == 'resources' &&
                    root.attributes().isEmpty() && root.children().size() == expectedCampaignLabels.size() &&
                    root.children().every { label ->
                        label.name() == 'string' && label.children().isEmpty() &&
                                label.attributes() == [name: label.@name.text()] && !label.text().trim().isEmpty()
                    } && (root.children().collect { it.@name.text() } as Set) == expectedCampaignLabels
            if (!isDrawing && !isPickerTheme && !isCampaignLabels) {
                throw new GradleException("Somente desenhos/recursos nativos de paridade podem ser registrados; layout XML continua proibido: ${source}")
            }
        }
        // Recursos de texto são dados, não Views XML. Permite recursos de tradução com vocabulário restrito.
        roots.collectMany { owner -> fileTree(owner).matching { include '**/src/main/res/values*/*.xml' }.files }
                .each { source ->
            def textRoot = new groovy.xml.XmlSlurper(false, false).parse(source)
            def textTypes = ['string', 'plurals', 'string-array'] as Set
            def textNodes = ['resources', 'string', 'plurals', 'string-array', 'item', 'b', 'i', 'u', 'annotation', 'xliff:g'] as Set
            if (textRoot.name() == 'resources' && !textRoot.children().isEmpty() &&
                    textRoot.children().every { it.name() in textTypes && !it.@name.text().isEmpty() } &&
                    textRoot.depthFirst().every { it.name() in textNodes }) {
                allowedPlatformXml.add(source.canonicalFile)
            }
        }
        def unexpectedXml = roots.collectMany { root ->
            fileTree(root).matching { include '**/src/**/*.xml' }.files
        }.findAll { source ->
            !allowedPlatformXml.contains(source.canonicalFile) && !allowedLegacyResourceXml.contains(source.canonicalFile)
        }
        if (!requiredManifest.isFile()) {
            throw new GradleException('AndroidManifest.xml obrigatório ausente no módulo :app.')
        }
        if (!requiredPlatformTheme.isFile()) {
            throw new GradleException('Tema de pré-splash obrigatório ausente no módulo :app.')
        }
        if (!adaptiveIcon.isFile() || !adaptiveRoundIcon.isFile()) {
            throw new GradleException('Definições de ícone adaptativo obrigatórias ausentes no módulo :app.')
        }
        if (!unexpectedXml.isEmpty()) {
            throw new GradleException("XML não permitido no código-fonte Compose: ${unexpectedXml}")
        }

        def forbiddenControllers = roots.collectMany { root ->
            fileTree(root).matching {
                include '**/src/main/**/*.kt', '**/src/domain/**/*.kt', '**/src/data/**/*.kt', '**/src/platform/**/*.kt', '**/src/host/**/*.kt', '**/src/main/**/*.java', '**/src/domain/**/*.java', '**/src/data/**/*.java', '**/src/platform/**/*.java', '**/src/host/**/*.java'
            }.files
        }.findAll { source ->
            source.name != 'MainActivity.kt' && source != file('app/src/main/java/br/gov/caixa/loterias/apostas/QueueActivity.kt') &&
                    (source.text =~ /\b(class|object)\s+\w*(Activity|Fragment)\b/).find()
        }
        if (!forbiddenControllers.isEmpty()) {
            throw new GradleException("Activities/Fragments de feature encontrados: ${forbiddenControllers}")
        }

        def hosts = fileTree(file('app/src/main')).matching {
            include '**/*.kt', '**/*.java'
        }.files.findAll { source ->
            (source.text =~ /\bclass\s+\w*Activity\b/).find()
        }
        def allowedHosts = ['MainActivity.kt', 'QueueActivity.kt'] as Set
        if (hosts.collect { it.name }.toSet() != allowedHosts || hosts.size() != 2) {
            throw new GradleException("O app deve ter apenas MainActivity e a entrada interna QueueActivity; encontradas: ${hosts}")
        }
        if (!requiredManifest.text.contains('android:name=".QueueActivity" android:exported="false"')) {
            throw new GradleException('QueueActivity deve permanecer não exportada.')
        }

        def fragmentUsage = roots.collectMany { root ->
            fileTree(root).matching { include '**/src/main/**/*.kt', '**/src/domain/**/*.kt', '**/src/data/**/*.kt', '**/src/platform/**/*.kt', '**/src/host/**/*.kt', '**/src/main/**/*.java', '**/src/domain/**/*.java', '**/src/data/**/*.java', '**/src/platform/**/*.java', '**/src/host/**/*.java' }.files
        }.findAll { source ->
            (source.text =~ /androidx\.fragment|\bclass\s+\w+\s*:\s*\w*Fragment\b/).find()
        }
        if (!fragmentUsage.isEmpty()) {
            throw new GradleException("Uso de Fragment encontrado: ${fragmentUsage}")
        }
    }
}

tasks.register('verifyLegacyUiInventory') {
    group = 'verification'
    description = 'Requires an explicit Compose replacement for every legacy setContentView entry.'
    doLast {
        def inventory = file('docs/LEGACY_UI_INVENTORY.tsv')
        def layoutBaseline = file('docs/LEGACY_LAYOUT_BASELINE.txt')
        def composeRouteCatalog = file('docs/COMPOSE_ROUTES.txt')
        if (!inventory.isFile()) throw new GradleException('Inventário da UI legada ausente.')
        if (!layoutBaseline.isFile()) throw new GradleException('Baseline completa dos layouts legados ausente.')
        if (!composeRouteCatalog.isFile()) throw new GradleException('Catálogo executável das rotas Compose ausente.')
        def legacyLayouts = layoutBaseline.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        if (legacyLayouts.size() != 414 || legacyLayouts.toSet().size() != 414 || legacyLayouts.any { !it.endsWith('.xml') }) {
            throw new GradleException("A baseline deve preservar os 414 layouts XML do CX; encontrados: ${legacyLayouts.size()}")
        }
        def composeRoutes = composeRouteCatalog.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        // 77 destinos e estados, além da Home, filtro e detalhes de modalidades da Home v2. Telas originais absorvidas por
        // componentes internos são registradas após `#` no inventário, em vez de como rotas.
        if (composeRoutes.size() != 80 || composeRoutes.toSet().size() != 80) {
            throw new GradleException("O catálogo deve conter os 80 destinos Compose únicos; encontrados: ${composeRoutes.size()}")
        }
        def lines = inventory.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        if (lines.first() != 'legacy_owner\tlegacy_layout\tcompose_target\tdisposition') {
            throw new GradleException('Cabeçalho inválido em LEGACY_UI_INVENTORY.tsv.')
        }
        def rows = lines.drop(1).collect { line -> line.split('\t', -1) }
        if (rows.size() != 102 || rows.any { it.size() != 4 }) {
            throw new GradleException("O inventário deve conter os 102 pontos legados com quatro colunas; encontrados: ${rows.size()}")
        }
        def duplicateKeys = rows.groupBy { "${it[0]}|${it[1]}" }.findAll { key, values -> values.size() > 1 }.keySet()
        if (!duplicateKeys.isEmpty()) throw new GradleException("Entradas legadas duplicadas: ${duplicateKeys}")
        def invalidDisposition = rows.findAll { it[3] !in ['compose', 'removed-debug-ui', 'replaced-platform-ui'] }
        if (!invalidDisposition.isEmpty()) throw new GradleException("Situação não auditada: ${invalidDisposition}")

        def sourceText = [file('app/src/main'), file('feature')].collectMany { root ->
            fileTree(root).matching { include '**/*.kt', '**/*.java' }.files
        }.collect { it.text }.join('\n')
        def missingRoutes = rows.findAll { it[3] == 'compose' }.collect { it[2].split('#')[0] }.unique().findAll { route ->
            route !in ['home', 'marketplace/filter'] && !sourceText.contains('"' + route + '"')
        }
        if (!missingRoutes.isEmpty()) throw new GradleException("Alvos Compose ausentes do catálogo: ${missingRoutes}")
        def uncataloguedTargets = rows.findAll { it[3] == 'compose' }
                .collect { it[2].split('#')[0] }.unique().findAll { !(it in composeRoutes) }
        if (!uncataloguedTargets.isEmpty()) throw new GradleException("Alvos fora de COMPOSE_ROUTES.txt: ${uncataloguedTargets}")
    }
}

tasks.register('verifyAppArchitecturePolicy', Exec) {
    group = 'verification'
    description = 'Exercises host architecture rules against isolated positive and negative fixtures.'
    commandLine 'python3', rootProject.file('scripts/test_app_architecture.py')
}

tasks.register('verifyCleanArchitecture') {
    dependsOn 'verifyFeatureModules', 'verifyAppArchitecturePolicy'
    group = 'verification'
    description = 'Enforces inward dependencies for Domain, Data and feature presentation.'
    doLast {
        def domainSources = project(':core:domain').sourceSets.main.allSource.matching { include '**/*.kt', '**/*.java' }.files +
                fileTree(file('feature')).matching { include '**/domain/src/main/**/*.kt', '**/domain/src/main/**/*.java', '**/api/src/main/**/*.kt', '**/api/src/main/**/*.java' }.files
        def invalidDomain = domainSources.findAll { source ->
            (source.text =~ /import\s+(android|androidx|retrofit2|okhttp3|br\.gov\.caixa\.loterias\.core\.(data|network|auth|queue|database|datastore))/).find()
        }
        if (!invalidDomain.isEmpty()) {
            throw new GradleException("Domain depende de camada externa: ${invalidDomain}")
        }

        def featureSources = fileTree(file('feature')).matching {
            include '**/src/main/**/*.kt', '**/src/main/**/*.java'
            include '**/src/host/**/*.kt', '**/src/host/**/*.java'
        }.files.findAll { source -> source.text =~ /(?m)^package\s+br\.gov\.caixa\.loterias\.feature\.\w+\.presentation(?:\.|$)/ }
        def featureInfrastructureImports = featureSources.findAll { source ->
            (source.text =~ /import\s+br\.gov\.caixa\.loterias\.core\.(data|network|database|datastore)\b/).find()
        }
        if (!featureInfrastructureImports.isEmpty()) {
            throw new GradleException("Feature acessa Data/Network diretamente: ${featureInfrastructureImports}")
        }

        def viewModelsUsingRepositories = featureSources.findAll { source ->
            source.name.endsWith('ViewModel.kt') &&
                    (source.text =~ /import\s+.*Repository\b/).find()
        }
        if (!viewModelsUsingRepositories.isEmpty()) {
            throw new GradleException("ViewModel deve depender de UseCase, não Repository: ${viewModelsUsingRepositories}")
        }

        def repositoryImplementations = project(':core:data').sourceSets.main.allSource.matching { include '**/*Repository*.kt', '**/*Repository*.java' }.files +
                fileTree(file('feature')).matching { include '**/data/src/main/**/*Repository*.kt', '**/data/src/main/**/*Repository*.java' }.files
        def repositoriesUsingRetrofit = repositoryImplementations.findAll { source ->
            (source.text =~ /\bLoteriasApi\b|retrofit2\./).find()
        }
        if (!repositoriesUsingRetrofit.isEmpty()) {
            throw new GradleException("Repository deve acessar a API por DataSource: ${repositoriesUsingRetrofit}")
        }

        def productionSources = [file('app'), file('core'), file('feature')].collectMany { root ->
            fileTree(root).matching { include '**/src/main/**/*.kt', '**/src/domain/**/*.kt', '**/src/data/**/*.kt', '**/src/platform/**/*.kt', '**/src/host/**/*.kt' }.files
        }
        def misplacedPackages = productionSources.findAll { source ->
            def matcher = source.text =~ /(?m)^package\s+([\w.]+)/
            def relative = source.path.replace('\\', '/').split('/src/main/(java|kotlin)/', 2)
            matcher.find() && relative.size() == 2 &&
                    matcher.group(1) != relative[1].substring(0, relative[1].lastIndexOf('/')).replace('/', '.')
        }
        if (!misplacedPackages.isEmpty()) throw new GradleException("Package incompatível com o módulo/caminho de produção: ${misplacedPackages}")

        def architecture = providers.exec {
            commandLine 'python3', rootProject.file('scripts/check-feature-architecture.py')
            ignoreExitValue = true
        }
        if (architecture.result.get().exitValue != 0) {
            throw new GradleException(architecture.standardError.asText.get())
        }
        logger.lifecycle(architecture.standardOutput.asText.get().trim())
        def hostArchitecture = providers.exec {
            commandLine 'python3', rootProject.file('scripts/check-app-architecture.py')
            ignoreExitValue = true
        }
        if (hostArchitecture.result.get().exitValue != 0) {
            throw new GradleException(hostArchitecture.standardError.asText.get())
        }
        logger.lifecycle(hostArchitecture.standardOutput.asText.get().trim())


        def hiltApplication = file('app/src/main/java/br/gov/caixa/loterias/apostas/LoteriasApplication.kt').text
        def host = file('app/src/main/java/br/gov/caixa/loterias/apostas/MainActivity.kt').text
        def module = file('app/src/main/java/br/gov/caixa/loterias/apostas/di/AppInitializationBindings.kt').text
        if (!hiltApplication.contains('@HiltAndroidApp') ||
                !host.contains('@AndroidEntryPoint') ||
                !module.contains('@Module') ||
                !module.contains('@InstallIn(SingletonComponent::class)')) {
            throw new GradleException('O composition root deve usar Hilt no Application, host e módulo Singleton.')
        }
    }
}

