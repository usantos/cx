// O Lint lê fontes Java gerados pelo Hilt em outras variantes. Executar
// os três analisadores simultaneamente pode remover ou recriar esses diretórios durante
// a análise. A matriz permanece completa, mas é serializada deliberadamente por variante.
project(':app').tasks.configureEach { task ->
    if (task.name in ['testPrdDebugUnitTest', 'testTqsDebugUnitTest', 'testAutomacaoDebugUnitTest']) {
        task.mustRunAfter ':app:assembleDebug'
    } else if (task.name == 'lintPrdDebug') {
        task.mustRunAfter ':app:testPrdDebugUnitTest', ':app:testTqsDebugUnitTest', ':app:testAutomacaoDebugUnitTest'
    } else if (task.name == 'lintTqsDebug') {
        task.mustRunAfter ':app:lintPrdDebug'
    } else if (task.name == 'lintAutomacaoDebug') {
        task.mustRunAfter ':app:lintTqsDebug'
    }
}

tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Builds every minified release flavor and validates legacy backend parity.'
    dependsOn 'verifyLegacyBackendParity', 'verifyNetworkSecurity', 'verifyTopazHeartbeat',
            ':app:assemblePrdRelease', ':app:assembleTqsRelease', ':app:assembleAutomacaoRelease'
}

tasks.register('verifyLegacyBackendParity') {
    group = 'verification'
    description = 'Prevents any backend operation used by the legacy app from being omitted from Retrofit.'
    doLast {
        def baseline = file('docs/LEGACY_BACKEND_BASELINE.tsv')
        if (!baseline.isFile()) throw new GradleException('Baseline dos serviços legados ausente.')
        def lines = baseline.readLines('UTF-8').findAll { !it.trim().isEmpty() }
        if (lines.first() != 'method\tpath') throw new GradleException('Cabeçalho inválido em LEGACY_BACKEND_BASELINE.tsv.')
        def expected = lines.drop(1) as Set
        if (expected.size() != 99) {
            throw new GradleException("A baseline deve conter as 99 operações usadas no legado; encontradas: ${expected.size()}")
        }

        def apiText = fileTree(file('core/network/src/main')).matching { include '**/*Api.kt' }
                .files.collect { it.getText('UTF-8') }.join('\n')
        def matcher = apiText =~ /@(GET|POST|PUT|DELETE|PATCH)\("([^"]+)"\)/
        def migrated = [] as Set
        matcher.each { match -> migrated.add("${match[1]}\t${match[2]}") }
        def missing = expected - migrated
        if (!missing.isEmpty()) {
            throw new GradleException("Operações do backend legado ausentes no Retrofit: ${missing.sort()}")
        }
    }
}

tasks.register('verifyAppIdentityAndFlavors') {
    group = 'verification'
    description = 'Ensures the official application namespace and environment matrix remain configured.'
    doLast {
        def appBuild = file('app/build.gradle').text
        def requiredSnippets = [
                "namespace = 'br.gov.caixa.loterias.apostas'",
                "applicationId 'br.gov.caixa.loterias.apostas'",
                'productFlavors',
                'prd {',
                'tqs {',
                'automacao {',
        ]
        def missing = requiredSnippets.findAll { !appBuild.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Identidade ou flavors obrigatórias ausentes: ${missing}")
        }
        def unexpectedPackage = fileTree(file('app/src')).matching {
            include '**/*.kt', '**/*.java'
        }.files.findAll { source -> source.text.contains('br.gov.caixa.loterias.compose') }
        if (!unexpectedPackage.isEmpty()) {
            throw new GradleException("Pacote temporário compose ainda referenciado: ${unexpectedPackage}")
        }
    }
}

tasks.register('verifyNetworkSecurity') {
    group = 'verification'
    description = 'Checks TLS pinning, release logging and its operational documentation.'
    doLast {
        def activeRoots = [file('app/src/main'), file('core/network/src/main'), file('core/key-management/src/main')]
        def sources = activeRoots.collectMany { root ->
            fileTree(root).matching { include '**/*.kt', '**/*.java' }.files
        }
        def unsafeTls = sources.findAll { source ->
            (source.text =~ /(?i)(trustAll|allowAllHostname|HostnameVerifier|X509TrustManager)/).find()
        }
        if (!unsafeTls.isEmpty()) {
            throw new GradleException("Implementação TLS permissiva no grafo moderno: ${unsafeTls}")
        }

        def appBuild = file('app/build.gradle').text
        if (!(appBuild =~ /release\s*\{[\s\S]*?ENABLE_NETWORK_LOGGING',\s*'false'/).find()) {
            throw new GradleException('Logs de rede devem permanecer desabilitados em release.')
        }
        if (!(appBuild =~ /release\s*\{[\s\S]*?ENABLE_MOCK_BACKEND',\s*'false'/).find()) {
            throw new GradleException('O backend mock deve permanecer desabilitado em release.')
        }
        if (!file('docs/SECURE_PIN_ROTATION.md').isFile()) {
            throw new GradleException('Documentação operacional da rotação de pins ausente.')
        }
        if (!file('docs/MOCK_BACKEND.md').isFile()) {
            throw new GradleException('Documentação operacional do backend mock ausente.')
        }
    }
}

tasks.register('verifyCaixaDS') {
    group = 'verification'
    description = 'Enforces CaixaDS as the visual contract of Compose features.'
    doLast {
        def consumerRoots = [file('app'), file('core/presentation'), file('core/navigation'), file('core/queue'), file('feature'), file('sample')]
        def sources = consumerRoots.collectMany { root ->
            fileTree(root).matching { include '**/src/main/**/*.kt', '**/src/domain/**/*.kt', '**/src/data/**/*.kt', '**/src/platform/**/*.kt', '**/src/host/**/*.kt' }.files
        }
        def literalColors = sources.findAll { source ->
            (source.text =~ /Color\s*\(\s*0[xX][0-9A-Fa-f]+/).find() ||
                    (source.text =~ /Color\.(White|Black|Red|Blue|Green|Yellow)\b/).find()
        }
        if (!literalColors.isEmpty()) {
            throw new GradleException("Cores literais fora do CaixaDS: ${literalColors}")
        }

        def directControls = sources.findAll { source ->
            (source.text =~ /import\s+androidx\.compose\.material3\.(Text|TextField|OutlinedTextField|Icon|Button|OutlinedButton|TextButton|IconButton|Checkbox|RadioButton|Card|Surface|Scaffold|AlertDialog|DropdownMenu|DropdownMenuItem|HorizontalDivider|CircularProgressIndicator|ModalBottomSheet|ModalNavigationDrawer|ProvideTextStyle|pulltorefresh\.PullToRefreshBox|\*)\s*(?:as\s+\w+)?(?:\r?\n|$)/).find()
        }
        directControls.addAll(sources.findAll { source ->
            (source.text =~ /\bandroidx\.compose\.material3\.(?:pulltorefresh\.)?(Text|TextField|OutlinedTextField|Icon|Button|OutlinedButton|TextButton|IconButton|Checkbox|RadioButton|Card|Surface|Scaffold|AlertDialog|DropdownMenu|DropdownMenuItem|HorizontalDivider|CircularProgressIndicator|ModalBottomSheet|ModalNavigationDrawer|ProvideTextStyle|PullToRefreshBox)\s*\(/).find()
        })
        directControls.addAll(sources.findAll { source ->
            (source.text =~ /import\s+androidx\.compose\.foundation\.text\.(BasicTextField|\*)\s*(?:as\s+\w+)?(?:\r?\n|$)/).find() ||
                    (source.text =~ /\bandroidx\.compose\.foundation\.text\.BasicTextField\s*\(/).find()
        })
        if (!directControls.isEmpty()) {
            throw new GradleException("Controles básicos devem ser consumidos pelo CaixaDS: ${directControls}")
        }

        def unownedVisualContracts = sources.findAll { source ->
            (source.text =~ /\bfun\s+(?:<[\s\S]*?>\s+)?CaixaDS\w*\s*\(/).find() ||
                    (source.text =~ /\bTypography\s*\(/).find() ||
                    (source.text =~ /import\s+androidx\.compose\.material\.icons\./).find() ||
                    (source.text =~ /\bfun\s+(BettingDSButton|BettingOptionDialog|LegacyAccountUnderlineField|LegacyAccountSaveFooter)\s*\(/).find()
        }
        if (!unownedVisualContracts.isEmpty()) {
            throw new GradleException("Componentes/tema/ícones compartilhados devem pertencer ao CaixaDS: ${unownedVisualContracts}")
        }

        def webConsumers = [file('app'), file('core'), file('feature')].collectMany { root ->
            fileTree(root).matching { include '**/src/main/**/*.kt'; exclude 'design-system/**' }.files
        }
        def unownedWebViews = webConsumers.findAll { source ->
            (source.text =~ /import\s+com\.kevinnzou\.web\./).find() ||
                    (source.text =~ /\bandroid\.webkit\.(WebView|WebChromeClient|WebViewClient|ConsoleMessage)\b/).find() ||
                    (source.text =~ /\bcom\.kevinnzou\.web\./).find() ||
                    (source.text =~ /import\s+androidx\.compose\.ui\.viewinterop\.AndroidView\b/).find() ||
                    (source.text =~ /\bandroidx\.compose\.ui\.viewinterop\.AndroidView\s*\(/).find() ||
                    (source.text =~ /\bandroid\.widget\.(Toast|TextView|Button|EditText|ImageView)\b/).find()
        }
        if (!unownedWebViews.isEmpty()) {
            throw new GradleException("WebViews, AndroidView e widgets nativos devem pertencer ao CaixaDS: ${unownedWebViews}")
        }

        def appHost = file('app/src/main/java/br/gov/caixa/loterias/apostas/composition/AppContent.kt')
        if (!appHost.text.contains('CaixaDSTheme')) {
            throw new GradleException('A composição raiz do app deve aplicar CaixaDSTheme ao conteúdo Compose.')
        }
        if (!file('docs/CAIXA_DS.md').isFile()) {
            throw new GradleException('Documentação do CaixaDS ausente.')
        }
    }
}

tasks.register('verifyTopazHeartbeat') {
    group = 'verification'
    description = 'Checks the unchanged CX Topaz SDK in the local Maven repository.'
    doLast {
        def aar = file('third-party/maven/br/com/topaz/heartbeat/4.38.0.1658708/heartbeat-4.38.0.1658708.aar')
        def expected = '82e586ee0417971b52decca1c23af6a933fd4c52a89ddc8b430d7433ccd01aad'
        if (!aar.isFile()) throw new GradleException('AAR Topaz Heartbeat homologado ausente.')
        def sdkManifest
        new java.util.zip.ZipFile(aar).withCloseable { zip ->
            zip.getInputStream(zip.getEntry('AndroidManifest.xml')).withCloseable { stream ->
                sdkManifest = new groovy.xml.XmlSlurper(false, false).parse(stream)
            }
        }
        def hostManifest = new groovy.xml.XmlSlurper(false, false).parse(file('app/src/main/AndroidManifest.xml'))
        def componentTypes = ['activity', 'service', 'receiver', 'provider']
        def sdkComponents = sdkManifest.application.children().findAll { componentTypes.contains(it.name()) }
        sdkComponents.each { component ->
            def name = component.'@android:name'.text()
            def override = hostManifest.application.children().find {
                it.name() == component.name() && it.'@android:name'.text() == name
            }
            if (override == null || override.'@android:enabled'.text() != '${topazComponentsEnabled}' ||
                    !override.'@tools:replace'.text().split(',').collect { it.trim() }.contains('android:enabled')) {
                throw new GradleException("Componente Topaz sem isolamento de simulação: ${name}")
            }
        }
        // WorkManager 2.7.1 is the resolved SDK dependency; preserve each original enabled default.
        def workComponents = [
            'androidx.work.impl.background.systemalarm.SystemAlarmService': ['service', '${topazWorkAlarmEnabled}'],
            'androidx.work.impl.background.systemjob.SystemJobService': ['service', '${topazWorkJobEnabled}'],
            'androidx.work.impl.foreground.SystemForegroundService': ['service', '${topazWorkForegroundEnabled}'],
            'androidx.work.impl.utils.ForceStopRunnable$BroadcastReceiver': ['receiver', '${topazWorkReceiverEnabled}'],
            'androidx.work.impl.background.systemalarm.ConstraintProxy$BatteryChargingProxy': ['receiver', '${topazWorkInactiveReceiverEnabled}'],
            'androidx.work.impl.background.systemalarm.ConstraintProxy$BatteryNotLowProxy': ['receiver', '${topazWorkInactiveReceiverEnabled}'],
            'androidx.work.impl.background.systemalarm.ConstraintProxy$StorageNotLowProxy': ['receiver', '${topazWorkInactiveReceiverEnabled}'],
            'androidx.work.impl.background.systemalarm.ConstraintProxy$NetworkStateProxy': ['receiver', '${topazWorkInactiveReceiverEnabled}'],
            'androidx.work.impl.background.systemalarm.RescheduleReceiver': ['receiver', '${topazWorkInactiveReceiverEnabled}'],
            'androidx.work.impl.background.systemalarm.ConstraintProxyUpdateReceiver': ['receiver', '${topazWorkAlarmEnabled}'],
            'androidx.work.impl.diagnostics.DiagnosticsReceiver': ['receiver', '${topazWorkReceiverEnabled}'],
        ]
        workComponents.each { name, expectedComponent ->
            def override = hostManifest.application.children().find {
                it.name() == expectedComponent[0] && it.'@android:name'.text() == name
            }
            if (override.'@android:enabled'.text() != expectedComponent[1] ||
                    !override.'@tools:replace'.text().contains('android:enabled')) {
                throw new GradleException("Entrega de WorkManager sem isolamento de simulação: ${name}")
            }
        }
        def isolationPolicy = file('core/security/src/main/java/br/gov/caixa/loterias/core/security/topaz/TopazMockComponentPolicy.kt').text.replace('\\$', '$')
        def isolatedNames = sdkComponents.collect { it.'@android:name'.text() } + workComponents.keySet()
        isolatedNames.each { name ->
            if (!isolationPolicy.contains('"' + name + '"')) {
                throw new GradleException("Bootstrap mock não cobre componente autônomo: ${name}")
            }
        }
        def application = file('app/src/main/java/br/gov/caixa/loterias/apostas/LoteriasApplication.kt').text
        def isolationIndex = application.indexOf('isolateTopazMockComponents(this, BuildConfig.ENABLE_MOCK_BACKEND)')
        if (isolationIndex < 0 || isolationIndex > application.indexOf('super.onCreate()') ||
                isolationIndex > application.indexOf('pushRuntime.start(this)')) {
            throw new GradleException('Isolamento de componentes mock deve acontecer antes dos runtimes da aplicação.')
        }
        def startup = hostManifest.application.provider.find { it.'@android:name'.text() == 'androidx.startup.InitializationProvider' }
        def workInitializer = startup.'meta-data'.find { it.'@android:name'.text() == 'androidx.work.WorkManagerInitializer' }
        if (startup.'@android:enabled'.text() == 'false' || startup.'@tools:node'.text() == 'remove' ||
                workInitializer.'@android:value'.text() != '${topazWorkInitializer}' ||
                !workInitializer.'@tools:replace'.text().contains('android:value')) {
            throw new GradleException('Simulação deve desabilitar apenas o initializer WorkManager, mantendo demais inicializadores AndroidX.')
        }
        def appBuild = file('app/build.gradle').text
        def originalWorkDefaults = [
            "topazWorkInitializer: 'androidx.startup'",
            "topazWorkAlarmEnabled: '@bool/enable_system_alarm_service_default'",
            "topazWorkJobEnabled: '@bool/enable_system_job_service_default'",
            "topazWorkForegroundEnabled: '@bool/enable_system_foreground_service_default'",
            "topazWorkReceiverEnabled: 'true'", "topazWorkInactiveReceiverEnabled: 'false'",
        ]
        if (originalWorkDefaults.any { !appBuild.contains(it) } ||
                !appBuild.contains("[key, mockBackendEnabled ? (key == 'topazWorkInitializer' ? 'mock-disabled' : 'false') : value]") ||
                !(appBuild =~ /release\s*\{[\s\S]*?manifestPlaceholders \+= topazWorkManagerDefaults/).find()) {
            throw new GradleException('WorkManager deve ficar desativado só em mock debug e conservar defaults em release.')
        }
        if (!(appBuild =~ /debug\s*\{[\s\S]*?manifestPlaceholders.topazComponentsEnabled\s*=\s*\(!mockBackendEnabled\).toString\(\)/).find() ||
                !(appBuild =~ /release\s*\{[\s\S]*?manifestPlaceholders.topazComponentsEnabled\s*=\s*'true'/).find()) {
            throw new GradleException('Isolamento Topaz deve seguir mock apenas em debug e permanecer ativo em release.')
        }

        def digest = java.security.MessageDigest.getInstance('SHA-256')
        aar.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read = stream.read(buffer); read != -1; read = stream.read(buffer)) {
                digest.update(buffer, 0, read)
            }
        }
        if (digest.digest().encodeHex().toString() != expected) {
            throw new GradleException('Checksum do SDK Topaz Heartbeat inválido.')
        }
    }
}

tasks.register('verifyFilaBraAar') {
    dependsOn ':app:verifyFilaBraTls'
    group = 'verification'
    description = 'Checks the pinned FilaBRA binary before packaging.'
    doLast {
        def aar = file('third-party/FilaBRAAdapter-2.6.5.1.aar')
        def expected = 'a27b67e45b6e9aa58346f90d61d18bed11160baf24f577d6c8119ba50bdf2bdd'
        if (!aar.isFile()) throw new GradleException("FilaBRA AAR ausente: ${aar}")
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        aar.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read = stream.read(buffer); read != -1; read = stream.read(buffer)) {
                digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expected) throw new GradleException("Checksum FilaBRA inválido: ${actual}")
    }
}

// Instrumented suites share one Android device: prevent a module from stealing
// focus from another module while its Compose assertions are running.
gradle.projectsEvaluated {
    def deviceTests = allprojects.collectMany { project ->
        project.tasks.matching { it.name.startsWith('connected') && it.name.endsWith('AndroidTest') && it.name != 'connectedAndroidTest' }.toList()
    }.sort { it.path }
    deviceTests.eachWithIndex { task, index ->
        if (index > 0) task.mustRunAfter(deviceTests.take(index))
    }
}
