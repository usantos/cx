# ============================================================================= #
# CAIXA DEVSECOPS - MODELO DE FLUXO DE TESTES ESTÁTICOS v1.0
# ============================================================================= #
# Modelo padrão de fluxo de trabalho para desenvolvedores da CAIXA.
# Automatiza a análise estática de código pelo Sonar,
# promovendo estabilidade, escalabilidade e entregas robustas.
# ============================================================================= #

# ============================================================================= #
# Nome do fluxo de trabalho para identificar execuções.
# ============================================================================= #

name: QA - Análise Estática de Código

# ============================================================================= #
# Nome dinâmico da execução para rastreabilidade e auditoria.
# ============================================================================= #
run-name: QUALIDADE-${{ github.repository }}_${{ github.ref_name }}_${{ github.run_id }}.${{ github.run_number }}

# ========================================================================================================================== #
# Eventos que disparam o fluxo de trabalho.
# ========================================================================================================================== #
# workflow_dispatch -> Permite a execução manual pela interface do GitHub.
# pull_request -> Executa automaticamente para solicitações de integração que correspondam aos filtros.
# types -> Executa na abertura,
# sincronização e reabertura de solicitações de integração.
# paths-ignore -> Para eventos de envio, ignora alterações
# em .github/** e catalog-info.yaml.
#                                                                                                                            #
# Documentação de referência
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow                    #
# ========================================================================================================================== #

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - '.github/**'
      - 'catalog-info.yaml'

# ====================================================================================================================================================== #
# Definições de tarefas
# ====================================================================================================================================================== #
# name: CI_DES -> Nome da tarefa exibido na interface do GitHub Actions.
# uses -> Modelo reutilizável de fluxo de garantia de qualidade.
# secrets: inherit -> Herda os segredos do repositório chamador.
#                                                                                                                                                        #
# Documentação de referência
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-jobs                                                           #
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows                                                                           #
# ====================================================================================================================================================== #

jobs:
  Solution-QA:
    name: QA
    uses: caixagithub/DevSecOps-Solutions/.github/workflows/quality-assurance.yml@main
    secrets: inherit
