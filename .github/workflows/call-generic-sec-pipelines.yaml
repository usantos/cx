# ============================================================================= #
# CAIXA DEVSECOPS - MODELO DE FLUXO DE SEGURANÇA v1.0
# ============================================================================= #
# Modelo padrão de fluxo de trabalho para desenvolvedores da CAIXA.
# Automatiza processos de segurança e produz insumos para avaliação.
# O fluxo de trabalho abrange três áreas:
# - Análise de código
# - Análise de vazamento de segredos
# - Análise de vulnerabilidades em dependências
# ============================================================================= #

# ============================================================================= #
# Nome do fluxo de trabalho para identificar execuções.
# ============================================================================= #

name: Call CodeQL workflow Seguranca

# ============================================================================= #
# Nome dinâmico da execução para rastreabilidade e auditoria.
# ============================================================================= #

run-name: Seguranca-${{ github.repository }}_${{ github.ref_name }}_${{ github.run_id }}.${{ github.run_number }}

# ========================================================================================================================== #
# Eventos que disparam o fluxo de trabalho.
# ========================================================================================================================== #
# push -> Executa automaticamente em eventos de envio que correspondam aos filtros.
# branches -> Para eventos de envio, executa somente em main e develop.
# paths-ignore -> Para eventos de envio, ignora alterações
# em .github/** e catalog-info.yaml.
# pull_request -> Executa automaticamente para solicitações de integração correspondentes.
# schedule -> Executa automaticamente conforme o agendamento configurado.
# cron -> Agenda a execução para toda segunda-feira às 01:00 UTC.
#                                                                                                                            #
# Documentação de referência
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow                    #
# ========================================================================================================================== #

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    # paths-ignore:
    #   - '.github/**'
    #   - 'catalog-info.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '.github/**'
      - 'catalog-info.yaml'
  schedule:
    - cron: "0 1 * * 1"

# ============================================================================================================================ #
# Permissões necessárias para interagir com serviços e automação de CI/CD.
# ============================================================================================================================ #
# contents: read -> Lê os arquivos do repositório.
# security-events: write -> Registra eventos de segurança.
# packages: read -> Lê pacotes como npm e Docker.
# actions: read -> Lê o GitHub Actions.
#                                                                                                                              #
# Documentação de referência
# https://docs.github.com/en/actions/tutorials/authenticate-with-github_token#modifying-the-permissions-for-the-github_token   #
# ============================================================================================================================ #

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

# ====================================================================================================================================================== #
# Definições de tarefas
# ====================================================================================================================================================== #
# name: CodeQL -> Nome da tarefa exibido na interface do GitHub Actions.
# uses -> Modelo reutilizável de fluxo de segurança.
# secrets: inherit -> Herda os segredos do repositório chamador.
# with: DINAMICALLY_CREATE_SETTINGS_XML: false ou true -> Controla a criação do settings.xml do Maven
# pela esteira, conforme exigido pelos repositórios Java Adapter.
# Documentação de referência
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-jobs                                                           #
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows                                                                           #
# ====================================================================================================================================================== #

jobs:
  CodeQL:
    name: CodeQL
    uses: caixagithub/DevSecOps-Solutions/.github/workflows/codeql-pipelines.yaml@main
    secrets: inherit
