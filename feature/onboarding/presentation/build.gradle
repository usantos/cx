apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'

android {
    compileSdk 36
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android { buildFeatures { compose = true } }

android { defaultConfig { minSdk 24 } }
dependencies {
    implementation project(':core:common')
    implementation project(':core:design-system')
    api project(':core:presentation')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.lifecycle.viewmodel.compose
    testImplementation project(':core:testing')
    testImplementation libs.junit4
}
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.onboarding'
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
}

dependencies {
    implementation project(':core:navigation')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.activity.compose
    implementation project(':feature:onboarding:data')
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.common
    api project(':feature:onboarding:domain')
    implementation project(':core:domain')
    implementation libs.kotlinx.coroutines.core
    implementation libs.lottie.compose
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.ext.junit
}

jacoco { toolVersion = '0.8.13' }

// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def onboardingCoverageData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}).filter { it.isFile() }
def onboardingCoverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug'),
        includes: ['**/StartupViewModel*.class', '**/StartupStatusContentKt.class', '**/StartupStatusKind.class', '**/OnboardingViewModel*.class', '**/OnboardingUiState*.class']
))
tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('testDebugUnitTest')
    executionData.from(onboardingCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(onboardingCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(onboardingCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(onboardingCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.95 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
