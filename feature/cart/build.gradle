apply from: rootProject.file('gradle/compose-feature.gradle')
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.cart'
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { debug { enableAndroidTestCoverage = true } }
    testCoverage { jacocoVersion = '0.8.13' }
}

dependencies {
    implementation project(':core:domain')
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.core
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

jacoco { toolVersion = '0.8.13' }
def cartCoverageData = fileTree(layout.buildDirectory).include('jacoco/testDebugUnitTest.exec', 'outputs/code_coverage/**/*.ec')
def cartCoverageClasses = files(fileTree(dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'), includes: [
        '**/*.class'
]))
tasks.register('verifyCartCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest'), 'connectedDebugAndroidTest'
    doLast {
        if (cartCoverageClasses.asFileTree.isEmpty() || cartCoverageData.isEmpty()) {
            throw new GradleException('Cobertura do carrinho sem classes ou execução de testes.')
        }
    }
}
tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('verifyCartCoverageInputs')
    executionData.from(cartCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(cartCoverageClasses)
    reports {
        xml.required = true
        html.required = true
    }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(cartCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(cartCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
