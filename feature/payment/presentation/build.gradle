apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.android.library'

android {
    compileSdk 37
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android { buildFeatures { compose = true } }

android { defaultConfig { minSdk 24 } }
dependencies {
    implementation project(':core:common')
    implementation project(':core:design-system')
    api project(':core:presentation')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.lifecycle.viewmodel.compose
    testImplementation libs.junit4
}
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.payment'
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
}

dependencies {
    implementation project(':core:navigation')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation project(':core:network')
    implementation project(':feature:payment:data')
    implementation project(':feature:cart:domain')
    implementation project(':feature:account:domain')
    api project(':feature:payment:domain')
    implementation project(':core:domain')
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.core
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.runner
}

jacoco { toolVersion = '0.8.13' }

// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def paymentCoverageData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}).filter { it.isFile() }
def paymentCoverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: [
                '**/PaymentRulesKt.class',
                '**/PurchaseNoticeRulesKt.class',
                '**/PurchaseNoticeUiState*.class',
                '**/MercadoPagoRegistrationViewModel*.class',
                '**/MercadoPagoRegistrationUiState*.class',
                '**/MercadoPagoRegistrationConsent*.class',
                '**/PaymentViewModel*.class',
                '**/PaymentMethodsLoading*.class',
                '**/PaymentSavedCards*.class',
                '**/PaymentPrePurchase*.class',
                '**/PaymentPixOperations*.class',
                '**/PaymentNotices*.class',
                '**/PaymentRedirects*.class',
                '**/PaymentUiState*.class',
                '**/PaymentCardViewModel*.class',
                '**/PaymentCardUiState*.class',
                '**/PaymentCardPurchaseContext*.class',
                '**/PaymentCardFormCoordinator*.class',
                '**/PaymentCardSavedCardsCoordinator*.class',
                '**/PaymentCardSubmissionCoordinator*.class',
                '**/PaymentCardMonitoringCoordinator*.class',
                '**/PaymentCardNoticeCoordinator*.class',
                '**/PaymentCardRedirectCoordinator*.class',
                '**/PaymentCardTrackedPurchase*.class',
                '**/PaymentCardStage.class',
                '**/PaymentTerminalViewModel*.class',
                '**/PaymentTerminalUiState*.class'
        ]
))
tasks.register('verifyPaymentCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest')
    doLast {
        if (paymentCoverageClasses.asFileTree.isEmpty() || paymentCoverageData.isEmpty()) {
            throw new GradleException('Cobertura de pagamento sem classes ou execução de testes.')
        }
    }
}
tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('verifyPaymentCoverageInputs')
    executionData.from(paymentCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(paymentCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(paymentCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(paymentCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
