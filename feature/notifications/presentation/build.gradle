apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.android.library'

android {
    compileSdk 37
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android { buildFeatures { compose = true } }

android { defaultConfig { minSdk 24 } }
dependencies {
    implementation project(':core:common')
    implementation project(':core:design-system')
    api project(':core:presentation')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.lifecycle.viewmodel.compose
    testImplementation libs.junit4
}
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.notifications'
    defaultConfig {
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appAuthRedirectScheme: 'br.gov.caixa.caixaloterias']
    }
    buildTypes { debug { enableAndroidTestCoverage = true } }
    testCoverage { jacocoVersion = '0.8.13' }
}

dependencies {
    implementation project(':core:navigation')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation project(':feature:notifications:data')
    implementation project(':feature:account:data')
    implementation project(':core:auth')
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.messaging
    api project(':feature:notifications:domain')
    implementation project(':core:domain')
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.runner
}

jacoco { toolVersion = '0.8.13' }
// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def notificationCoverageData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}, fileTree(layout.buildDirectory).include('outputs/code_coverage/**/*.ec')).filter { it.isFile() }
def notificationCoverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: ['**/*.class']
))
tasks.register('verifyNotificationCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest'), 'connectedDebugAndroidTest'
    doLast {
        if (notificationCoverageClasses.asFileTree.isEmpty() || notificationCoverageData.isEmpty()) {
            throw new GradleException('Cobertura de notificações sem classes ou execução de testes.')
        }
    }
}
tasks.register('jacocoDebugTestReport', JacocoReport) {
    dependsOn tasks.named('verifyNotificationCoverageInputs')
    executionData.from(notificationCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(notificationCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugTestReport')
    executionData.from(notificationCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(notificationCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
