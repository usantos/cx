apply from: rootProject.file('gradle/compose-feature.gradle')
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.account'
    defaultConfig {
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appAuthRedirectScheme: 'br.gov.caixa.caixaloterias']
    }
}

dependencies {
    implementation project(':core:auth')
    implementation project(':core:domain')
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.kotlinx.coroutines.core
    testImplementation project(':core:network')
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.appauth
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

jacoco { toolVersion = '0.8.13' }

def accountCoverageData = fileTree(layout.buildDirectory).include('jacoco/testDebugUnitTest.exec')
def accountCoverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: [
                '**/LoginViewModel*.class',
                '**/LoginUiState*.class',
                '**/LogoutViewModel*.class',
                '**/LogoutUiState*.class',
                '**/LogoutNotice*.class',
                '**/SessionRecoveryViewModel*.class',
                '**/SessionRecoveryState*.class',
                '**/AccountStatusViewModel*.class',
                '**/PersonalDataViewModel*.class',
                '**/RegistrationViewModel*.class'
        ]
))
tasks.register('verifyAccountCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest')
    doLast {
        if (accountCoverageClasses.asFileTree.isEmpty() || accountCoverageData.isEmpty()) {
            throw new GradleException('Cobertura de conta sem classes ou execução de testes.')
        }
    }
}
tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('verifyAccountCoverageInputs')
    executionData.from(accountCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(accountCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(accountCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(accountCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
