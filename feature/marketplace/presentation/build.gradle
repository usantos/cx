apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'jacoco'

android {
    namespace = 'br.gov.caixa.loterias.feature.marketplace'
    compileSdk 37
    defaultConfig { minSdk 24; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildFeatures { compose = true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    testOptions {
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ['jdk.internal.*']
        }
    }
}

dependencies {
    androidTestImplementation libs.androidx.constraintlayout
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation project(':core:presentation')
    testImplementation project(':core:testing')
    implementation project(':core:navigation')
    implementation project(':feature:marketplace-filter:presentation')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation project(':feature:account:domain')
    implementation project(':core:network')
    implementation project(':feature:marketplace:data')
    implementation project(':feature:retail:domain')
    implementation project(':feature:cart:domain')
    implementation project(':feature:betting:domain')
    api project(':feature:marketplace:domain')
    implementation project(':core:domain')
    implementation project(':core:design-system')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.kotlinx.coroutines.core

    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.ext.junit
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
}

jacoco { toolVersion = '0.8.13' }

// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec obsoleto com caminho fixo.
def coverageExecutionData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}).filter { it.isFile() }
def coverageSourceDirectories = files('src/main/java')
def coverageClassDirectories = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: [
                '**/MarketplaceViewModel.class',
                '**/MarketplaceViewModel$*.class',
                '**/MarketplaceLoadingCoordinator*.class',
                '**/MarketplaceSearchPagination.class',
                '**/MarketplaceFavoriteRetailersCoordinator*.class',
                '**/MarketplacePoolFavoriteCoordinator*.class',
                '**/MarketplaceSharesCoordinator.class',
                '**/MarketplaceCartCoordinator*.class',
                '**/MarketplaceUiState.class',
                '**/MarketplaceDetailViewModel.class',
                '**/MarketplaceDetailUiState.class'
        ]
))

tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('testDebugUnitTest')
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSourceDirectories)
    classDirectories.from(coverageClassDirectories)
    reports { xml.required = true; html.required = true }
}

tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSourceDirectories)
    classDirectories.from(coverageClassDirectories)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoDebugCoverageVerification')
}
