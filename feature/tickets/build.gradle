apply from: rootProject.file('gradle/compose-feature.gradle')
apply plugin: 'jacoco'

// Instrumentation-only visibility for read-only installed reference font/theme probes.
// Generated under build so no platform XML is introduced into the feature's source tree.
def referenceVisibilityManifest = layout.buildDirectory.file('generated/reference-visibility/AndroidManifest.xml')
def generateReferenceVisibilityManifest = tasks.register('generateReferenceVisibilityManifest') {
    outputs.file(referenceVisibilityManifest)
    doLast {
        def manifestFile = referenceVisibilityManifest.get().asFile
        manifestFile.parentFile.mkdirs()
        manifestFile.text = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <queries><package android:name="br.gov.caixa.loterias.apostas" /></queries>
</manifest>
'''
    }
}

android {
    namespace = 'br.gov.caixa.loterias.feature.tickets'
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    sourceSets.androidTest.manifest.srcFile(referenceVisibilityManifest.get().asFile)
}

tasks.matching { it.name == 'preDebugAndroidTestBuild' }.configureEach {
    dependsOn generateReferenceVisibilityManifest
}

dependencies {
    implementation project(':core:design-system')
    implementation project(':core:domain')
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.activity.compose
    implementation libs.kotlinx.coroutines.core
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation libs.androidx.camera.compose
    implementation libs.mlkit.barcode.scanning
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

jacoco { toolVersion = '0.8.13' }

def coverageExecutionData = fileTree(layout.buildDirectory).include('jacoco/testDebugUnitTest.exec')
def coverageSourceDirectories = files('src/main/java')
def coverageClassDirectories = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: [
                '**/BetDetailRulesKt.class',
                '**/TicketsViewModel.class',
                '**/TicketsUiState.class',
                '**/BetFilters.class',
                '**/PurchaseFilters.class'
        ]
))

tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('testDebugUnitTest')
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSourceDirectories)
    classDirectories.from(coverageClassDirectories)
    reports { xml.required = true; html.required = true }
}

tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSourceDirectories)
    classDirectories.from(coverageClassDirectories)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoDebugCoverageVerification')
}
