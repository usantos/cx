apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.android.library'

android {
    compileSdk 37
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android { buildFeatures { compose = true } }

android { defaultConfig { minSdk 24 } }
dependencies {
    implementation project(':core:common')
    implementation project(':core:design-system')
    api project(':core:presentation')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.lifecycle.viewmodel.compose
    testImplementation libs.junit4
}
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.retail'
    defaultConfig {
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appAuthRedirectScheme: 'br.gov.caixa.caixaloterias']
    }
    buildTypes { debug { enableAndroidTestCoverage = true } }
    testCoverage { jacocoVersion = '0.8.13' }
}

dependencies {
    implementation project(':feature:payment:presentation')
    implementation project(':core:navigation')
    implementation project(':core:auth')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation project(':core:network')
    implementation project(':feature:retail:data')
    implementation project(':feature:payment:domain')
    implementation project(':feature:betting:domain')
    api project(':feature:retail:domain')
    implementation project(':core:domain')
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.core
    implementation libs.zxing.core
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.runner
}

jacoco { toolVersion = '0.8.13' }
// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def retailCoverageData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}, fileTree(layout.buildDirectory).include('outputs/code_coverage/**/*.ec')).filter { it.isFile() }
def retailCoverageClasses = files(fileTree(dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'), includes: [
        '**/*RulesKt*.class', '**/*ViewModel*.class', '**/*UiState*.class', '**/PrizeRegistrationNotice*.class',
        '**/PrizeRedemptionCoordinator*.class', '**/PrizeLotteryChannel*.class', '**/PrizePixChannel*.class',
        '**/PrizeMercadoPagoChannel*.class', '**/PrizeRedemptionSubmission*.class', '**/PrizeRedemptionTimer*.class',
        '**/PrizeRedemptionReceipts*.class', '**/PrizeRedemptionNotices*.class', '**/PrizeRedemptionRedirects*.class',
        '**/PrizeReceiptDelivery*.class', '**/PrizeReceiptSavingKt*.class', '**/PrizeQrCodeGenerator*.class',
        '**/PrizeRedemptionStage*.class', '**/PrizePixKeySource*.class', '**/PrizeReceipt.class', '**/PrizeReceipt$*.class'
]))
// Inclui as classes de corrotinas e lambdas: nelas ficam os resultados de API,
// as falhas, o cancelamento e o contador, não apenas código sintético descartável.
tasks.register('verifyRetailCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest'), 'connectedDebugAndroidTest'
    doLast {
        if (retailCoverageClasses.asFileTree.isEmpty() || retailCoverageData.isEmpty() ||
                fileTree(layout.buildDirectory).include('outputs/code_coverage/**/*.ec').isEmpty()) {
            throw new GradleException('Cobertura de retail sem classes ou execução de testes. Gere ambos antes da verificação.')
        }
    }
}
tasks.register('jacocoDebugTestReport', JacocoReport) {
    dependsOn tasks.named('verifyRetailCoverageInputs')
    executionData.from(retailCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(retailCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugTestReport')
    executionData.from(retailCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(retailCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
