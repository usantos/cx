apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk 36
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }

apply plugin: 'jacoco'
android {
    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes { debug { enableAndroidTestCoverage = true } }
    testCoverage { jacocoVersion = '0.8.13' }
    testOptions.unitTests.all { test ->
        test.jacoco.includeNoLocationClasses = true
        test.jacoco.excludes = ['jdk.internal.*']
    }
}
jacoco { toolVersion = '0.8.13' }
dependencies {
    api libs.gson
    implementation libs.kotlinx.coroutines.core
    testImplementation project(':core:testing')
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.retrofit.converter.gson
    androidTestImplementation libs.junit4
    androidTestImplementation libs.kotlinx.coroutines.core
    androidTestImplementation libs.androidx.test.runner
}
android { namespace = 'br.gov.caixa.loterias.feature.results.data' }

dependencies {
    api libs.gson
    api project(':core:data')
    api project(':core:domain')
    api project(':core:network')
    api project(':feature:results:domain')
    api project(':feature:tickets:domain')
}
