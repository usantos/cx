apply from: rootProject.file('gradle/compose-feature.gradle')
apply plugin: 'jacoco'
android {
    namespace = 'br.gov.caixa.loterias.feature.home'
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { debug { enableAndroidTestCoverage = true } }
    testCoverage { jacocoVersion = '0.8.13' }
}

dependencies {
    implementation project(':core:domain')
    implementation libs.kotlinx.coroutines.core
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

jacoco { toolVersion = '0.8.13' }
def homeCoverageData = fileTree(layout.buildDirectory).include('jacoco/testDebugUnitTest.exec', 'outputs/code_coverage/**/*.ec')
def homeCoverageClasses = files(fileTree(dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'), includes: [
        '**/HomeViewModel*.class', '**/HomeUiState*.class', '**/HomeNotificationRedirect*.class', '**/HomeFormattingKt*.class', '**/HomeDrawer*.class',
        '**/HomePaymentNoticeKt*.class', '**/ComposableSingletons$HomePaymentNoticeKt*.class',
        '**/HomeNotificationPopupKt*.class', '**/ComposableSingletons$HomeNotificationPopupKt*.class',
        '**/NotificationLinkKt*.class'
]))
tasks.register('verifyHomeCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest')
    dependsOn 'connectedDebugAndroidTest'
    doLast {
        if (homeCoverageClasses.asFileTree.isEmpty() || homeCoverageData.isEmpty()) {
            throw new GradleException('Cobertura da Home sem classes ou execução de testes.')
        }
    }
}
tasks.register('jacocoDebugTestReport', JacocoReport) {
    dependsOn tasks.named('verifyHomeCoverageInputs')
    executionData.from(homeCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(homeCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugTestReport')
    executionData.from(homeCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(homeCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
