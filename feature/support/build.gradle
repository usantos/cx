apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'jacoco'

android {
    namespace = 'br.gov.caixa.loterias.feature.support'
    compileSdk 37

    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures { compose = true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ['jdk.internal.*']
        }
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.compose.webview
    implementation project(':core:design-system')
    implementation project(':core:domain')
    implementation project(':core:presentation')
    implementation platform(libs.androidx.compose.bom)
    androidTestImplementation platform(libs.androidx.compose.bom)

    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.kotlinx.coroutines.core
    debugImplementation libs.androidx.compose.ui.tooling
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
}

jacoco { toolVersion = '0.8.13' }

def coverageData = fileTree(layout.buildDirectory).include('jacoco/testDebugUnitTest.exec')
def coverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: ['**/SupportReducerKt.class', '**/SupportViewModel.class']
))

tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('testDebugUnitTest')
    executionData.from(coverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(coverageClasses)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoDebugCoverageVerification')
}
