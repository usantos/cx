## Para mais detalhes sobre a configuração do ambiente de compilação, consulte
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Especifica os argumentos da JVM usados pelo processo daemon.
# Esta opção é útil para ajustar as configurações de memória.
# Valor padrão: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# Quando configurado, o Gradle executa no modo paralelo experimental.
# Esta opção deve ser usada apenas com projetos desacoplados. Para mais detalhes, consulte
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#13 de fevereiro de 2026, 12:21:17 BRT
android.enabledR8.fullMode=true
android.useAndroidX=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Lint com Hilt/KSP pode ler fontes gerados de outra variante enquanto ela
# ainda está sendo reescrita, quando as verificações de variantes executam em paralelo.
org.gradle.parallel=false
# =============================================================================
# VERSIONAMENTO
# =============================================================================
FARM_VERSION_CODE=230102400
DES_VERSION_CODE=230102400
PLT_VERSION_CODE=230102400
PRD_VERSION_CODE=230125000

FARM_VERSION_NAME=1.24.0
DES_VERSION_NAME=1.24.0
PLT_VERSION_NAME=1.24.0
PRD_VERSION_NAME=1.25.0

# Limita os processos de trabalho para que D8, Lint e Kotlin respeitem a memória local disponível.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2048m

# Analisador atualizado de forma independente; o plugin de build permanece AGP 8.13.0.
android.experimental.lint.version=9.2.1
