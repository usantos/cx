## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Fri Feb 13 12:21:17 BRT 2026
android.enabledR8.fullMode=true
android.useAndroidX=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Lint 9.2 + Hilt/KSP can read generated sources from another flavor while that
# flavor is still being rewritten when variant checks run in parallel.
org.gradle.parallel=false
# =============================================================================
# VERSIONAMENTO
# =============================================================================
FARM_VERSION_CODE=230102400
DES_VERSION_CODE=230102400
PLT_VERSION_CODE=230102400
PRD_VERSION_CODE=230125000

FARM_VERSION_NAME=1.24.0
DES_VERSION_NAME=1.24.0
PLT_VERSION_NAME=1.24.0
PRD_VERSION_NAME=1.25.0

# Bound workers so D8, lint and Kotlin stay within the local memory budget.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx2048m
