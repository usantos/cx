apply plugin: 'com.android.library'

android {
    compileSdk 37
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android { buildFeatures { compose = true } }
apply plugin: 'jacoco'

android {
    namespace = 'br.gov.caixa.loterias.core.queue'
    compileSdk 37
    defaultConfig { minSdk 24 }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    testOptions {
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ['jdk.internal.*']
        }
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation project(':core:design-system')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui

    compileOnly files('../../third-party/FilaBRAAdapter-2.6.5.1.aar')
    implementation libs.androidx.appcompat
    implementation libs.gson
    testImplementation libs.junit4
    testImplementation files('../../third-party/FilaBRAAdapter-2.6.5.1.aar')
}

jacoco { toolVersion = '0.8.13' }

// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def coverageExecutionData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}).filter { it.isFile() }
def coverageSourceDirectories = files('src/main/java')
def coverageClassDirectories = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: ['**/QueueConsoleEventParser.class']
))

tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('testDebugUnitTest')
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSourceDirectories)
    classDirectories.from(coverageClassDirectories)
    reports { xml.required = true; html.required = true }
}

tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(coverageExecutionData)
    sourceDirectories.from(coverageSourceDirectories)
    classDirectories.from(coverageClassDirectories)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoDebugCoverageVerification')
}
