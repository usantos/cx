apply plugin: 'com.android.library'

android {
    compileSdk 37
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android { buildFeatures { compose = true } }
apply plugin: 'jacoco'

android {
    namespace = 'br.gov.caixa.loterias.core.presentation'
    compileSdk 37
    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes { debug { enableAndroidTestCoverage = true } }
    testCoverage { jacocoVersion = '0.8.13' }
    buildFeatures { compose = true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api(libs.redux.kotlin.threadsafe) {
        exclude group: 'org.reduxkotlin', module: 'redux-kotlin'
    }
    api libs.redux.kotlin.core
    api project(':core:domain')
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation project(':core:design-system')
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.core
    debugImplementation libs.androidx.compose.ui.tooling
    testImplementation libs.junit4
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest
    androidTestImplementation libs.androidx.test.runner
}

// As regras compartilhadas de avisos de serviço mantêm sua própria verificação após a extração de retail.
jacoco { toolVersion = '0.8.13' }
// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def noticeCoverageData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}, fileTree(layout.buildDirectory).include('outputs/code_coverage/**/*.ec')).filter { it.isFile() }
def noticeCoverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'),
        includes: ['**/BrazilianCurrencyFormattingKt*.class', '**/NoticeFormatting*.class', '**/ServiceNoticeRules*.class', '**/ServiceNoticeUiState*.class', '**/ServiceConnectionRules*.class', '**/ServiceFailure*.class', '**/ServiceRedirectEvent*.class']
))
tasks.register('verifyNoticeCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest'), 'connectedDebugAndroidTest'
    doLast {
        if (noticeCoverageClasses.asFileTree.isEmpty() || noticeCoverageData.isEmpty()) {
            throw new GradleException('Cobertura dos avisos compartilhados sem classes ou execução de testes.')
        }
    }
}
tasks.register('jacocoNoticeReport', JacocoReport) {
    dependsOn tasks.named('verifyNoticeCoverageInputs')
    executionData.from(noticeCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(noticeCoverageClasses)
    reports { xml.required = true; html.required = true }
}
tasks.register('jacocoNoticeVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoNoticeReport')
    executionData.from(noticeCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(noticeCoverageClasses)
    violationRules { rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.9501 } } }
}
tasks.named('check').configure { dependsOn tasks.named('jacocoNoticeVerification') }
