escolha_10_numeros_entre_os_80_d_0f5ae8=Escolha 10 n\u00fameros entre os 80 dispon\u00edveis, logo ap\u00f3s escolha o time do cora\u00e7\u00e3o e <b>ganhe pr\u00eamios acertando 7, 6, 5, 4 e 3 dos n\u00fameros sorteados e/ou acertando o time do cora\u00e7\u00e3o</b>. Voc\u00ea pode concorrer com a <b>mesma aposta por 3, 6, 9 ou 12 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_50_numeros_entre_os_100_2c8ac4=Escolha 50 n\u00fameros entre os 100 dispon\u00edveis e <b>ganhe pr\u00eamios acertando 20, 19, 18, 17, 16, 15 ou nenhum dos n\u00fameros sorteados</b>. Escolhendo a op\u00e7\u00e3o <b>"aposta-espelho" o sistema realiza um jogo automaticamente com os 50 n\u00fameros que voc\u00ea n\u00e3o escolheu</b>, aumentando suas chances. Voc\u00ea pode concorrer com a <b>mesma aposta por 2, 3, 4, 6, 8, 9 ou 12 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_de_15_a_20_numeros_entre_562def=Escolha de 15 a 20 n\u00fameros entre os 25 n\u00fameros dispon\u00edveis e <b>ganhe pr\u00eamios acertando 11, 12, 13, 14 ou 15 dos n\u00fameros sorteados</b>. Voc\u00ea pode concorrer com <b>a mesma aposta por 2, 3, 4, 6, 8, 9, 12, 18 ou 24 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_de_5_a_15_numeros_entre_8f6942=Escolha de 5 a 15 n\u00fameros entre os 80 dispon\u00edveis e <b>ganhe pr\u00eamios acertando 2 (duque), 3 (terno) ou 4 (quadra) ou 5 (quina)</b> dos n\u00fameros sorteados. Voc\u00ea pode concorrer com <b>a mesma aposta por 3, 6, 12, 18 ou 24 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_de_6_a_12_numeros_entre_17d285=Escolha de 6 a 12 n\u00fameros entre os 50 dispon\u00edveis, logo ap\u00f3s escolha de 2 a 6 trevos dos 6 disponiveis e <b>ganhe pr\u00eamios acertando 6 n\u00fameros + 1, 2 ou nenhum trevo; 5 n\u00fameros + 1, 2 ou nenhum trevo; 4 n\u00fameros + 1, 2 ou nenhum trevo; 3 n\u00fameros + 1 ou 2 trevos; 2 n\u00fameros + 1 ou 2 trevos</b>. Voc\u00ea pode <b>concorrer com a mesma aposta por 2, 3, 4 ou 5 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_de_6_a_15_numeros_entre_093c29=Escolha de 6 a 15 n\u00fameros entre os 50 dispon\u00edveis e <b>ganhe pr\u00eamios acertando 3 (terno), 4 (quadra), 5 (quina) ou 6 (sena)</b> dos n\u00fameros sorteados em um ou nos dois sorteios. Voc\u00ea pode concorrer com a <b>mesma aposta por 2, 3, 4, 6, 8, 9 ou 12 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_de_6_a_20_numeros_entre_667389=Escolha de 6 a 20 n\u00fameros entre os 60 dispon\u00edveis e <b>ganhe pr\u00eamios acertando 6 (sena), 5 (quina) ou 4 (quadra)</b> dos n\u00fameros sorteados. Voc\u00ea pode concorrer com a mesma aposta por <b>2, 3, 4, 6, 8, 9 ou 12 concursos consecutivos</b> com a <b>op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o <b>surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea</b>, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_de_7_a_15_numeros_entre_41efca=Escolha de 7 a 15 n\u00fameros entre os 31 dispon\u00edveis, logo ap\u00f3s escolha o m\u00eas de sorte e <b>ganhe pr\u00eamios acertando 7, 6, 5 ou 4 dos n\u00fameros sorteados e/ou acertando o m\u00eas de sorte</b>. Voc\u00ea pode concorrer com a mesma aposta por <b>3, 6, 9 ou 12 concursos consecutivos com a op\u00e7\u00e3o teimosinha</b>. Com a op\u00e7\u00e3o surpresinha, o sistema escolhe os n\u00fameros por voc\u00ea, tornando sua aposta mais pr\u00e1tica, nesta op\u00e7\u00e3o os n\u00fameros apenas ser\u00e3o revelados a voc\u00ea ap\u00f3s o pagamento.
escolha_os_resultados_dos_jogos_fe3e2d=Escolha os resultados dos jogos abaixo. Voc\u00ea precisa apostar em todos os jogos, sendo que <b>pelo menos 1 palpite deve ser duplo</b> (apostar nos dois times ou em um time e no empate) <b>ou triplo</b> (apostar em empate e nos dois times). <b>O valor da sua aposta depende da quantidade de duplas e triplas.</b> Voc\u00ea ganha com 13 ou 14 palpites corretos.
falha_na_tentativa_de_conexao_co_3a89ba=Falha na tentativa de conex\u00e3o com o servidor
nao_foi_possivel_concluir_esta_o_3c7db3=N\u00e3o foi poss\u00edvel concluir esta opera\u00e7\u00e3o. Por favor, tente novamente.
o_cpf_vinculado_ao_e_mail_inform_f8be0d=O CPF vinculado ao e-mail informado deve ser o mesmo CPF cadastrado nas Loterias CAIXA.
o_super_sete_tem_7_colunas_cada_84c6ee=O Super sete tem 7 colunas, cada uma com os n\u00fameros de 0 a 9. <b>Voc\u00ea deve escolher, no m\u00ednimo, 1 n\u00famero em cada coluna</b>. Se quiser, pode marcar mais n\u00fameros, at\u00e9 3 por coluna, aumentando suas chances de ganhar. No sorteio, \u00e9 escolhido 1 n\u00famero de cada coluna (total de 7 n\u00fameros). <b>Ganha quem acertar a partir de 3 n\u00fameros na ordem correta das colunas</b>.
o_tempo_de_conexao_expirou_806cae=O Tempo de conex\u00e3o expirou.
o_termo_de_uso_foi_atualizado_e_959939=O termo de Uso foi Atualizado. \u00c9 necess\u00e1rio aceitar novamente.
opa_ocorreu_um_erro_na_sua_requi_3fbf1f=Opa, ocorreu um erro na sua requisi\u00e7\u00e3o. Por favor, tente novamente dentro de alguns instantes.
parece_que_sua_internet_esta_com_15865a=Parece que sua internet est\u00e1 com alguma instabilidade. Verifique sua conex\u00e3o e tente novamente.
sua_sessao_expirou_e_necessario_a7a802=Sua sess\u00e3o expirou. \u00c9 necess\u00e1rio realizar o login novamente para continuar utilizando o aplicativo Loterias CAIXA.
