apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'jacoco'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
kotlin { jvmToolchain(21) }
jacoco { toolVersion = '0.8.13' }
dependencies {
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
}


dependencies {
    api libs.kotlinx.coroutines.core
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
}

jacoco { toolVersion = '0.8.13' }

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
    dependsOn tasks.named('test')
    executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/test.exec'))
    sourceDirectories.setFrom(files('src/main/java'))
    classDirectories.setFrom(files(fileTree(dir: layout.buildDirectory.dir('classes/kotlin/main'))))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }
        }
    }
}

tasks.named('check').configure { dependsOn tasks.named('jacocoTestCoverageVerification') }
