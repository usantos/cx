apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk 36
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies { coreLibraryDesugaring libs.desugar.jdk.libs }
apply plugin: 'jacoco'

android {
    namespace = 'br.gov.caixa.loterias.core.auth'
    compileSdk 36
    defaultConfig {
        minSdk 23
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appAuthRedirectScheme: 'br.gov.caixa.caixaloterias']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation libs.androidx.lifecycle.process

    implementation project(':feature:account:domain')
    implementation project(':core:network')
    implementation libs.appauth
    implementation libs.gson
    implementation libs.kotlinx.coroutines.core
    testImplementation libs.junit4
    androidTestImplementation libs.androidx.test.auth.runner
    androidTestImplementation libs.androidx.test.ext.junit
}

jacoco { toolVersion = '0.8.13' }

// O AGP escolhe o destino dos testes unitários; nunca mescle um arquivo exec fixo obsoleto.
def authCoverageData = files({
    tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
}).filter { it.isFile() }
// Verifica o estado de tokens/tentativas, sem certificar a cobertura da integração Android/AppAuth.
def authCoverageClasses = files(fileTree(
        dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug'),
        includes: ['**/SessionTokenStore*.class', '**/AuthorizationAttempt*.class', '**/PendingAuthorization*.class',
                   '**/EndSessionRegistry*.class', '**/EndSessionLaunch*.class', '**/EndSessionOutcome*.class',
                   '**/TokenEndpointIdentity*.class', '**/BiometricAttemptRegistry*.class',
                   '**/RegularSessionRefreshCoordinator*.class', '**/BackendSessionRefresh*.class']
))

tasks.register('verifyAuthCoverageInputs') {
    dependsOn tasks.named('testDebugUnitTest')
    doLast {
        if (authCoverageClasses.asFileTree.isEmpty() || authCoverageData.isEmpty()) {
            throw new GradleException('Cobertura do estado de autenticação sem classes ou execução de testes.')
        }
    }
}

tasks.register('jacocoDebugCoverageReport', JacocoReport) {
    dependsOn tasks.named('verifyAuthCoverageInputs')
    executionData.from(authCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(authCoverageClasses)
    reports { xml.required = true; html.required = true }
}

tasks.register('jacocoDebugCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('jacocoDebugCoverageReport')
    executionData.from(authCoverageData)
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(authCoverageClasses)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.9501
            }
        }
    }
}

tasks.named('check').configure { dependsOn tasks.named('jacocoDebugCoverageVerification') }
