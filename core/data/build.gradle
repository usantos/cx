        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/FavoriteCartUsageLocalDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/FavoriteCartUsageLocalDataSourceImpl$*.class'
