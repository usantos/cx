        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/RecentPurchaseLocalDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/RecentPurchaseLocalDataSourceImpl$*.class'
