        exclude '**/br/gov/caixa/loterias/feature/cart/data/mapper/GuestCartRowsKt.class', '**/br/gov/caixa/loterias/feature/cart/data/mapper/GuestCartRowsKt$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/mapper/LocalCartMapperKt.class', '**/br/gov/caixa/loterias/feature/cart/data/mapper/LocalCartMapperKt$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/mapper/VisitorCartMapperKt.class', '**/br/gov/caixa/loterias/feature/cart/data/mapper/VisitorCartMapperKt$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/repository/CartTransferRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/repository/CartTransferRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/repository/FavoriteCartUsageRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/repository/FavoriteCartUsageRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/repository/LocalCartRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/repository/LocalCartRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/repository/RecentPurchaseRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/repository/RecentPurchaseRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/repository/VisitorCartRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/repository/VisitorCartRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/home/data/repository/HomeLayoutRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/home/data/repository/HomeLayoutRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/onboarding/data/datasource/local/OnboardingLocalDataSource.class', '**/br/gov/caixa/loterias/feature/onboarding/data/datasource/local/OnboardingLocalDataSource$*.class'
        exclude '**/br/gov/caixa/loterias/feature/onboarding/data/datasource/local/OnboardingLocalDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/onboarding/data/datasource/local/OnboardingLocalDataSourceImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/onboarding/data/repository/OnboardingRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/onboarding/data/repository/OnboardingRepositoryImpl$*.class'
        exclude '**/feature/cart/data/datasource/local/CartSnapshotLocalDataSourceKt*.class'
    }
} })
def dataCoverageSources = files({ [sourceSets.main.allSource.srcDirs] + featureDataProjects.collect { it.projectDir.toPath().resolve('src/main/kotlin').toFile() } })

tasks.register('verifyDataCoverageInputs') {
    // Estas suítes nativas reais também produzem dados de execução consumidos por este relatório.
    dependsOn ':feature:account:data:connectedDebugAndroidTest', ':feature:cart:data:connectedDebugAndroidTest', ':feature:notifications:data:connectedDebugAndroidTest'
    dependsOn tasks.named('test')
    dependsOn featureDataProjects.collect { it.path + ':testDebugUnitTest' }
    dependsOn ':app:testPrdDebugUnitTest'
    doLast {
        if (dataCoverageClasses.asFileTree.isEmpty() || dataCoverageExecution.isEmpty()) {
            throw new GradleException('Cobertura de data sem classes ou execução de testes.')
        }
    }
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('verifyDataCoverageInputs')
    executionData.setFrom(dataCoverageExecution)
    sourceDirectories.setFrom(dataCoverageSources)
    classDirectories.setFrom(dataCoverageClasses)
    reports { xml.required = true; html.required = true }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification).configure {
    dependsOn tasks.named('jacocoTestReport')
    executionData.setFrom(dataCoverageExecution)
    sourceDirectories.setFrom(dataCoverageSources)
    classDirectories.setFrom(dataCoverageClasses)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.9501
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
