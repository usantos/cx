        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartReceiptPhase.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartReceiptPhase$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartSnapshotKt.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartSnapshotKt$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartSnapshotLocalDataSource.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartSnapshotLocalDataSource$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartSnapshotLocalDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartSnapshotLocalDataSourceImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTableDataSource.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTableDataSource$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTableDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTableDataSourceImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTransferLocalDataSource.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTransferLocalDataSource$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTransferLocalDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTransferLocalDataSourceImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTransferLocalDataSourceImplKt.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/CartTransferLocalDataSourceImplKt$*.class'
