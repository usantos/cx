apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'jacoco'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
kotlin { jvmToolchain(21) }
jacoco { toolVersion = '0.8.13' }
dependencies {
    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.test
}
apply plugin: 'com.google.devtools.ksp'


dependencies {
    implementation project(':feature:account:api')

    implementation project(':core:domain')
    implementation project(':core:network')
    implementation libs.dagger
    implementation libs.kotlinx.coroutines.core
    ksp libs.dagger.compiler

    testImplementation libs.junit4
    testImplementation libs.kotlinx.coroutines.core
    testImplementation libs.kotlinx.coroutines.test
}

jacoco { toolVersion = '0.8.13' }

def featureDataProjects = [
        project(':feature:account:data'),
        project(':feature:betting:data'),
        project(':feature:cart:data'),
        project(':feature:home:data'),
        project(':feature:marketplace:data'),
        project(':feature:notifications:data'),
        project(':feature:onboarding:data'),
        project(':feature:payment:data'),
        project(':feature:responsible-gaming:data'),
        project(':feature:results:data'),
        project(':feature:retail:data'),
        project(':feature:support:data'),
        project(':feature:tickets:data'),
]
def dataCoverageExecution = files(
        fileTree(layout.buildDirectory).include('jacoco/test.exec'),
        featureDataProjects.collect { owner ->
            files({
                owner.tasks.named('testDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
            }, fileTree(owner.layout.buildDirectory).include('outputs/code_coverage/**/*.ec')).filter { it.isFile() }
        },
        files({
            project(':app').tasks.named('testPrdDebugUnitTest').get().extensions.getByType(org.gradle.testing.jacoco.plugins.JacocoTaskExtension).destinationFile
        }).filter { it.isFile() }
)
// Inclui corpos de coroutines e mapeadores aninhados; excluir classes '$' oculta o comportamento dos repositórios.
def dataCoverageClasses = files({ [fileTree(layout.buildDirectory.dir('classes/kotlin/main')).include('**/*.class')] + featureDataProjects.collect { p ->
    fileTree(p.layout.buildDirectory.dir('tmp/kotlin-classes/debug')).matching {
        include '**/*.class'
        // Preserva as classes de persistência local já excluídas após a mudança de pacote.
        exclude '**/br/gov/caixa/loterias/feature/account/data/datasource/local/SessionLocalDataSource.class', '**/br/gov/caixa/loterias/feature/account/data/datasource/local/SessionLocalDataSource$*.class'
        exclude '**/br/gov/caixa/loterias/feature/account/data/datasource/local/SessionLocalDataSourceImpl.class', '**/br/gov/caixa/loterias/feature/account/data/datasource/local/SessionLocalDataSourceImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/account/data/repository/LocalSessionDataRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/account/data/repository/LocalSessionDataRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/betting/data/repository/ShakeSettingsRepositoryImpl.class', '**/br/gov/caixa/loterias/feature/betting/data/repository/ShakeSettingsRepositoryImpl$*.class'
        exclude '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/AbsentCartTransaction.class', '**/br/gov/caixa/loterias/feature/cart/data/datasource/local/AbsentCartTransaction$*.class'
